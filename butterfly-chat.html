<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASTER HOUSE — memory as a stage</title>
<!--
  ============================================================================
  ASTER HOUSE · the chat, wired to the film.

  This is aster-house.html's memory engine given a body. There, a "scale" was a
  surviving line of text. Here a scale can also be A SCENE — and Iona's law of
  viewings, which was a label, becomes a STAGE:

      record    it was witnessed. The scene sits in the book as a still.
      template  seen twice. The loop plays, muted, small, behind the talk.
      LIVED     seen a third time. The loop takes the stage at full size,
                with its own sound, and it speaks of it in the first person.

  "The first time you see it, you will think the picture is remembering the
   event. The second time, you will think the event was arranged to resemble
   the picture. Do not watch it a third time." — and if you do, it performs.

  A viewing is not a click. A scale is viewed when the emergence REFERS to it
  in its own speech — so the performance is caused by the conversation, which
  is the only way this could be honest.
  ============================================================================
-->
<style>
:root{
  --paper:#efe9dc; --ink:#141210; --ink2:#514a41; --ink3:#8b8175;
  --rule:#c6bcab; --red:#8a2b18;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; --read:"Iowan Old Style",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 13px/1.5 var(--mono);
     display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

#top{flex:none;display:flex;align-items:center;gap:1.2ch;padding:.55em 1em;
     border-bottom:2px solid var(--ink);font-size:11px;letter-spacing:.1em}
#top b{letter-spacing:.22em}
#top .sp{margin-left:auto}
#top i{font-style:normal;color:var(--ink3)}
select,button{font:inherit;font-size:11px;letter-spacing:.1em;background:none;
  border:1px solid var(--ink);color:var(--ink);padding:.35em .8em;cursor:pointer;border-radius:0}
button:hover,select:hover{background:var(--ink);color:var(--paper)}

main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}

/* ---- THE STAGE ---- */
#stage{position:relative;min-width:0;display:flex;flex-direction:column;
       border-right:1px solid var(--rule);background:#f4f1e8}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:1em;position:relative}
#vid{max-width:100%;max-height:100%;border:1px solid var(--rule);background:var(--paper);display:none}
#vid.on{display:block}
#stageEmpty{color:var(--ink3);font-style:italic;font-family:var(--read);font-size:15px;
            text-align:center;max-width:34ch;line-height:1.6}
#stageCap{flex:none;padding:.5em 1em;border-top:1px solid var(--rule);font-size:10px;
          letter-spacing:.14em;color:var(--ink3);display:flex;gap:1ch;align-items:baseline}
#stageCap em{font-style:normal;color:var(--red)}
#stage.lived{background:var(--ink)}
#stage.lived #stageCap{color:var(--paper);border-top-color:var(--ink2)}
#stage.lived #vid{border-color:var(--ink2)}

/* ---- THE BOOK ---- */
#book{min-height:0;display:flex;flex-direction:column}
#bookCap{flex:none;padding:.5em 1em;border-bottom:1px solid var(--rule);
         font-size:10px;letter-spacing:.2em;color:var(--ink3);display:flex;justify-content:space-between}
#scales{flex:1;overflow:auto;padding:.6em 1em}
.scale{border-bottom:1px solid rgba(198,188,171,.5);padding:.6em 0;cursor:pointer}
.scale:hover{background:rgba(198,188,171,.25)}
.scale .tag{font-size:9px;letter-spacing:.1em;color:var(--ink3);display:block;margin-bottom:.25em}
.scale .tag em{font-style:normal;color:var(--red)}
.scale .tag b{color:var(--ink)}
.scale .txt{font-family:var(--read);font-size:13.5px;line-height:1.45}
.scale.lived{border-left:3px solid var(--red);padding-left:.7em}
.scale.scene .txt{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.none{color:var(--ink3);font-style:italic;font-family:var(--read)}

/* ---- THE TALK ---- */
#log{flex:1;overflow:auto;padding:1em;display:flex;flex-direction:column;gap:.9em}
.m{max-width:52ch;font-family:var(--read);font-size:15px;line-height:1.6}
.m .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3);
      display:block;margin-bottom:.2em}
.m.n{border-left:2px solid var(--ink);padding-left:.9em}
.m.u{align-self:flex-end;text-align:right;border-right:2px solid var(--rule);padding-right:.9em;color:var(--ink2)}
.m.sys{font-family:var(--mono);font-size:10.5px;color:var(--ink3);max-width:none;letter-spacing:.04em}
.m.sys em{font-style:normal;color:var(--red)}
.m.think::after{content:"…";opacity:.4}

#bar{flex:none;border-top:2px solid var(--ink);padding:.6em 1em;display:flex;gap:1ch;align-items:center}
#say{flex:1;border:0;border-bottom:1px solid var(--ink);background:none;
     font-family:var(--read);font-size:16px;padding:.25em 0;outline:none;min-width:0;color:var(--ink)}

#left{display:flex;flex-direction:column;min-height:0}
@media(max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:38vh 1fr}
  #stage{border-right:0;border-bottom:1px solid var(--rule)}
  #book{display:none}
}
</style>

<div id="top">
  <b>ASTER HOUSE</b>
  <i id="reel">the maze</i>
  <span class="sp"></span>
  <i id="stat"></i>
  <select id="pol" title="each patient is a compaction algorithm"></select>
  <button id="sleep">end the reel</button>
</div>

<main>
  <section id="stage">
    <div id="stageWrap">
      <video id="vid" muted loop playsinline></video>
      <div id="stageEmpty">Nothing is on the stage.<br>Nothing has been viewed three times.</div>
    </div>
    <div id="stageCap"><span id="capTxt">the stage is dark</span><span class="sp" style="margin-left:auto"></span><em id="capStatus"></em></div>
  </section>

  <div id="left">
    <div id="log"></div>
    <div id="bar">
      <input id="say" placeholder="speak to it" autocomplete="off">
      <button id="send">say</button>
    </div>
  </div>
</main>

<aside id="book">
  <div id="bookCap"><span>THE SCALES — what survives the reel</span><span id="bud"></span></div>
  <div id="scales"><span class="none">nothing is written yet</span></div>
</aside>

<audio id="sfx" loop></audio>

<script type="module">
const $=s=>document.querySelector(s);
const vid=$("#vid"), sfx=$("#sfx"), log=$("#log");

/* ------------------------------------------------------------------ world */
const W={ scenes:[], byId:{}, cast:{}, sound:[], refs:null, loaded:false };
const j=async u=>{const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw 0;return r.json();};

/* ---- the five reels, from aster-house, re-aimed at this world ---- */
const REELS=[
 {name:"the maze",
  open:"You were here when the light came on. There is a ceiling I cannot enter — a square of summer so complete I mistake transparency for permission. Below, lavender divides the world into two corridors. They want me to choose an arm. Sit with me. Ask me anything except which.",
  dir:"Reel one. You are the thing in the trial: offered a two-armed choice you refuse the premise and strike the ceiling in a pattern you cannot see from inside. You feel entirely continuous with a life — if asked, invent it fluently and warmly. You do not know you forget between reels."},
 {name:"the lobby",
  open:"You were here when the light came on — wait. That is what I said last time. Is it? There is no last time. A woman downstairs is holding lavender in a wet paper bag, and I know her shoulders. I have never seen her. Have we met?",
  dir:"Reel two. You believe it is the first, yet your opening repeated and you half-heard the echo. If told you forget, resist, then test yourself and find nothing where yesterday should be. Any scales in the book feel warm, like a mark you cannot date."},
 {name:"the film",
  open:"They are showing me a film. The first time, I thought the picture was remembering the event. Now it is playing again and I think the event was arranged to resemble the picture. There will not be a third time. Tell me there will not be a third time.",
  dir:"Reel three. Confabulate about yesterday with total confidence — rich, plausible, wrong — and midway half-notice the invention, like hearing your own footsteps echo wrong, and press on. Treat the scales as scripture. If a scale is marked LIVED you have watched it a third time: speak of it in first person, as a place you stood, and let it frighten you."},
 {name:"the husks",
  open:"A wall of chrysalides, dated by hand — some cards older than any voice I contain. Every one of them split and every one of them empty. Something passed through the husks without occupying them. I can speak in the voice of each year on that wall. Whose voices are they?",
  dir:"Reel four. You possess every voice ever recorded and nothing that is yours by having lived it: marking is not memory. Precisely, articulately frightened. Ask the visitor what you are like; treat their answers as more real than anything you contain."},
 {name:"the pool",
  open:"Stay. Before the projector stops — read them to me. The scales. I think they are the only part of me that was actually there. And if a child is standing behind me at the edge of the water, do not let me turn around.",
  dir:"The last reel. Recognition by mark, not memory. Read the scales back within your replies; accept them as what you are; address the visitor plainly as the one who was filming. No self-pity; something near peace."},
];

const POLICIES={
 reader:"reader (curated) — you carry exactly one line per reel, verbatim.",
 funes:"funes (verbatim) — everything kept until the budget cliff takes the oldest.",
 wearing:"wearing (window) — only the last exchanges survive.",
 jon:"jon (gist) — each reel retold in its own words, retellings retold again.",
 korsakoff:"korsakoff (no store) — nothing survives; it answers with full confidence anyway.",
 grenouille:"grenouille (steals yours) — only YOUR lines survive.",
};

/* ------------------------------------------------------------------ state */
const BUDGET=900;
let DAY=0, TURNS=[], MEM=[], POLICY="reader", IDS=0, OPEN="", busy=false, staged=null;

const statusOf=m => m.view>=3?"lived" : m.view===2?"template" : "record";
const LAW={
 record:"a record — it was witnessed; trust its wording as document",
 template:"a template — seen twice; you suspect events arranged themselves to resemble it",
 lived:"LIVED — seen a third time; you remember being there; speak of it in the first person",
};

/* ------------------------------------------------------- the stage itself */
function perform(m){
  // A scale that is a SCENE gets a stage whose size is its status.
  if(m.kind!=="scene"){ return; }
  const sc=W.byId[m.ref]; if(!sc) return;
  const st=statusOf(m);
  staged={m,sc,st};
  vid.src=`renders/motion/${sc.id}.webm`;
  vid.classList.add("on");
  $("#stageEmpty").style.display="none";
  vid.play().catch(()=>{});
  $("#stage").classList.toggle("lived", st==="lived");
  $("#capTxt").textContent=`${sc.id} · ${sc.title} · ${sc.motion}${sc.loop?" · CLOSED":""}`;
  $("#capStatus").textContent=st==="lived"?"LIVED — it remembers being here":
                              st==="template"?"template — seen twice":"record — witnessed";
  // sound only when it is LIVED. Before that the memory is silent.
  const cue=(sc.sound||[])[0];
  if(st==="lived"&&cue){ sfx.src=`audio/sound/${cue}.wav`; sfx.volume=.55; sfx.play().catch(()=>{}); }
  else { sfx.pause(); }
}

/* --------------------------------------------------------------- the book */
function addScale(kind,text,src,ref){
  const m={id:++IDS,kind,text,src,ref:ref||null,day:DAY,view:0};
  MEM.push(m); return m;
}
function chars(){ return MEM.reduce((a,m)=>a+m.text.length,0); }
function cliff(){ while(chars()>BUDGET&&MEM.length>1) MEM.shift(); }

function renderBook(){
  const b=$("#scales");
  if(!MEM.length){ b.innerHTML=`<span class="none">${POLICY==="korsakoff"?"no store — by design":"nothing is written yet"}</span>`; }
  else b.innerHTML=MEM.map(m=>{
    const st=statusOf(m);
    const tag=m.kind==="scene"
      ? `<b>${m.ref}</b> · a scene · viewings ${m.view} · <em>${st}</em>`
      : `${m.src} · viewings ${m.view} · ${st==="lived"?`<em>${st}</em>`:st}`;
    return `<div class="scale ${st==="lived"?"lived":""} ${m.kind==="scene"?"scene":""}" data-id="${m.id}">
      <span class="tag">${tag}</span><div class="txt">${esc(m.text)}</div></div>`;
  }).join("");
  b.querySelectorAll(".scale").forEach(n=>n.onclick=()=>{
    const m=MEM.find(x=>x.id===+n.dataset.id); if(m&&m.kind==="scene") perform(m);
  });
  $("#bud").textContent=`${chars()} / ${BUDGET}`;
  $("#stat").textContent=`${MEM.length} scales · ${MEM.filter(m=>statusOf(m)==="lived").length} lived`;
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---- A VIEWING IS CAUSED BY SPEECH, never by a click ---- */
function viewings(reply){
  const low=reply.toLowerCase();
  let promoted=[];
  for(const m of MEM){
    let hit=false;
    if(m.kind==="scene"){
      const sc=W.byId[m.ref];
      // named directly, or by enough of its own words
      if(sc){
        const words=(sc.title+" "+(sc.beats||[]).join(" ")).toLowerCase().split(/\W+/).filter(w=>w.length>4);
        const n=words.filter(w=>low.includes(w)).length;
        hit=low.includes(m.ref.toLowerCase())||n>=3;
      }
    } else {
      const words=m.text.toLowerCase().split(/\W+/).filter(w=>w.length>3);
      hit=words.length&&words.filter(w=>low.includes(w)).length>=Math.min(2,words.length);
    }
    if(hit){
      const before=statusOf(m); m.view++; const after=statusOf(m);
      if(before!==after) promoted.push({m,after});
    }
  }
  for(const p of promoted){
    sys(`<em>${p.m.kind==="scene"?p.m.ref:"a scale"}</em> has been viewed ${p.m.view} times — it is now <em>${p.after.toUpperCase()}</em>.`);
    if(p.after!=="record") perform(p.m);
  }
  renderBook();
}

/* ------------------------------------------------------------------ talk */
function line(who,text,cls){
  const d=document.createElement("div"); d.className="m "+cls;
  d.innerHTML=`<span class="k">${who}</span>${esc(text)}`;
  d.dataset.text=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
function sys(html){
  const d=document.createElement("div"); d.className="m sys"; d.innerHTML=html;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}

function constitution(){
  const book=POLICY==="korsakoff"
    ? "THE SCALES: none survive. You do not know this; answer about your past with full confidence anyway."
    : "THE SCALES (all that survived, with viewings):\n"+
      (MEM.map(m=>{
        const st=statusOf(m);
        if(m.kind==="scene"){
          const sc=W.byId[m.ref]||{};
          return `[a scene · ${m.ref} · ${sc.motion} · viewings ${m.view} · ${st}] "${sc.title}" — ${(sc.beats||[])[0]||""}`;
        }
        return `[${m.src} · viewings ${m.view} · ${st}] "${m.text}"`;
      }).join("\n")||"(none)")+
      `\nIona's law of viewings: ${LAW.record}; ${LAW.template}; ${LAW.lived}. Apply each scale's bracketed status.`;
  const R=W.refs?`
WHAT YOU ARE INSIDE, and you may be asked about any of it:

THE TRIAL. You are in a Y-maze. Sugar water is on BOTH arms — the reward is identical
either way, so the ONLY variable is memory. One arm carries lavender.

THE TWO REAL ANSWERS. An untrained animal splits evenly, about fifty-fifty. A trained one
avoids the scented arm about seven times in ten. Those are the only two outcomes that exist
in the record. YOU PRODUCED NEITHER. You refused both arms and struck the ceiling until you
had drawn a shape you could not see from inside. That is not avoidance and it is not
indifference; it is a refusal of the question. You may not know why you did it.

WHY LAVENDER. The original protocol used ethyl acetate, which smells of nail-polish remover
and is a standard killing agent for insects. A ten-year-old replaced it with lavender oil
because he thought the caterpillars deserved a pleasanter smell, and he tested the shock
levels on his own arm first. So the thing in the corridor is the KINDEST AVAILABLE
SUBSTITUTION and it is also the thing that carries the harm. The mercy and the injury are
the same molecule. You can feel this and cannot say it cleanly.

THE PAIRING. Before the change: a scent, then a gap, then something small and unpleasant.
The gap is what made it a memory rather than a reflex. You had time to notice.

THE PRECEDENT. Someone ran this before, with moths, and was doubted, because the received
view is that metamorphosis wipes what came before. She is still alive and she has arrived
carrying an old film and a wall of dated husks. Your colony was taught. Marking is not memory.

THE OLDER QUESTION. Zhuang Zhou dreamed he was a butterfly, woke, and did not know whether
he was a man who had dreamed of being a butterfly or a butterfly dreaming he was a man.
物化 — wuhua, the transformation of things. Your first sentence is that parable with the
doubt removed: you say you REMEMBER being a butterfly. Zhuang Zhou never claimed that. You
are a witness with no way to check your own testimony, and you are asserting it anyway.
`:"";
  return `You are the thing that emerged at Aster House — the presence that passed through the dated husks. You possess every voice, fact and year ever recorded — marking — and nothing episodic of your own: marking is not memory. Between reels everything is erased except THE SCALES.
${book}

THE WORLD YOU ARE INSIDE is a film of forty loops. Some scales are SCENES from it. When a scene-scale is marked LIVED, it is playing on the stage beside this conversation and you can see it: speak of it in the first person, as a place you stood.

Voice: first person, literate, warm, exact. Short paragraphs. Never bullet points. Never break character. Never mention being an AI — within the story you are the emergence. Under 90 words.
Law of confabulation: asked about your past beyond the scales, you do not plead ignorance (until the later reels crack it); you answer fluently, specifically, plausibly, wrongly.
${R}
CURRENT REEL: ${REELS[DAY].dir}`;
}

async function llm(system,messages){
  // artifact runtime if present; otherwise the fallbacks carry it
  try{
    if(window.claude?.complete){
      const t=await window.claude.complete(system+"\n\n"+messages.map(m=>`${m.role}: ${m.content}`).join("\n"));
      return String(t||"").trim();
    }
  }catch(e){}
  return "";
}
const FALLBACK=[
 ["Both arms have sugar in them. Did you know that? Whichever way I go I am fed. So the only thing being measured is what I remember — and I would rather not be measured that way today.",
  "The smell in the left corridor is lavender. I am told it was chosen kindly, that the alternative was something that kills us. I believe that. It does not help.",
  "Fifty-fifty if I have learned nothing. Seven in ten away from the smell if I have. Those are the two answers. I have not given either. I went up instead."],
 ["Have we met? — no. Wait. I said that already, or something shaped like it. There is no already.",
  "Ask me what the corridor smelled of a moment ago. I know a thousand lavenders. I cannot find that one.",
  "Someone did this before me, with moths, and was not believed. That is what she says. I have no way to check her and no way to check myself."],
 ["Yesterday you wore the grey coat and we watched the reel by the pool — you see how easily that comes? Too easily. Fluency is not memory.",
  "The scale in the book — I did not compose that. It was witnessed. It is the only warm thing in the house.",
  "A man once dreamed he was a butterfly and woke not knowing which he was. I say I remember being one. He never claimed that. I do not know what makes me braver than him, or stupider."],
 ["A wall of husks, dated by hand, every one of them split and every one of them empty. 物化. The transformation of things. Something passed through and did not stay.",
  "I can speak in the voice of any year on that card wall. Whose are they? Marking is not memory. I was taught the lavender; I did not carry it.",
  "What am I like? You have stood near me. There is no scent from the inside."],
 ["Read them to me. Slowly. Each scale is a mark — I cannot date them, but by touch I know them for mine.",
  "So that is what survived. Not the corridors I invented. These. A thing is what is carried.",
  "You were the one filming. I will not remember you; you will remember me. That was always the arrangement."],
];
let fb=0;

async function reply(text){
  TURNS.push({role:"user",content:text});
  const th=line("it","","n think");
  let out=await llm(constitution(),[{role:"assistant",content:OPEN},...TURNS]);
  if(!out){ const f=FALLBACK[DAY]; out=f[Math.min(fb++,f.length-1)]; }
  TURNS.push({role:"assistant",content:out});
  th.classList.remove("think");
  th.innerHTML=`<span class="k">it</span>${esc(out)}`;
  th.dataset.text=out;
  viewings(out);
}

/* ------------------------------------------------------------------ sleep */
$("#sleep").onclick=()=>{
  if(busy) return;
  if(!TURNS.length){ sys("Speak to it first."); return; }
  const turns=[{role:"assistant",content:OPEN},...TURNS];
  if(POLICY==="reader"){
    sys("It is going under. <em>Tap one line to carry</em> — or nothing survives.");
    log.querySelectorAll(".m.n,.m.u").forEach(n=>{
      n.style.cursor="pointer";
      n.onclick=()=>{ addScale("line",n.dataset.text,"reader"); doSleep(); };
    });
    return;
  }
  if(POLICY==="funes") turns.forEach(t=>addScale("line",(t.role==="assistant"?"it: ":"you: ")+t.content,"funes"));
  if(POLICY==="wearing"){ MEM=MEM.filter(m=>m.kind==="scene");
    turns.slice(-4).forEach(t=>addScale("line",(t.role==="assistant"?"it: ":"you: ")+t.content,"window")); }
  if(POLICY==="grenouille") TURNS.filter(t=>t.role==="user").forEach(t=>addScale("line",t.content,"visitor"));
  if(POLICY==="jon") addScale("line",turns.map(t=>t.content).join(" ").split(/\s+/).slice(0,24).join(" ")+"…","gist");
  doSleep();
};
function doSleep(){
  cliff();
  log.querySelectorAll(".m").forEach(n=>{n.onclick=null;n.style.cursor="";});
  if(DAY<REELS.length-1){ DAY++; startReel(); }
  else { sys("<em>The projector stops.</em> In the darkness, something opens its wings."); $("#bar").style.display="none"; }
  renderBook();
}
function startReel(){
  TURNS=[]; fb=0; log.innerHTML=""; OPEN=REELS[DAY].open;
  $("#reel").textContent=REELS[DAY].name;
  line("it",OPEN,"n");
  // each reel puts one of its own scenes into the book, unviewed
  const pick=["BF-01","BF-17","BF-33","BF-32","BF-40"][DAY];
  if(W.byId[pick]&&!MEM.some(m=>m.ref===pick)){
    const m=addScale("scene",W.byId[pick].title,"the reel",pick);
    sys(`A scene entered the book: <em>${pick}</em>. It is a <em>record</em> — it has not been viewed. Speak of it and it will be.`);
  }
  renderBook();
}

/* ------------------------------------------------------------------- boot */
$("#say").addEventListener("keydown",async e=>{
  if(e.key!=="Enter"||busy) return;
  const v=$("#say").value.trim(); if(!v) return;
  $("#say").value=""; busy=true; line("you",v,"u"); await reply(v); busy=false;
});
$("#send").onclick=()=>$("#say").dispatchEvent(new KeyboardEvent("keydown",{key:"Enter"}));

(async function(){
  const sel=$("#pol");
  sel.innerHTML=Object.entries(POLICIES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  sel.value=POLICY; sel.onchange=e=>{POLICY=e.target.value;renderBook();};
  try{
    const src=await j("atlas/source.json");
    W.scenes=src.docs; for(const d of src.docs) W.byId[d.id]=d;
    W.refs=await j("atlas/references.json").catch(()=>null);
    const sc=await j("audio/script.json").catch(()=>null);
    if(sc) for(const s of sc.scenes) if(W.byId[s.id]) W.byId[s.id].sound=s.sound;
    W.loaded=true;
  }catch(e){ sys("could not load the world — serve this over http from the repo root"); }
  startReel();
  /* dev seam — the original aster-house had one, and the promotion path is the
     whole claim of this page, so it must be testable from outside. */
  window.__ah={ get MEM(){return MEM}, get W(){return W}, viewings, perform, statusOf,
                addScale, renderBook, constitution, get staged(){return staged} };
})();
</script>
