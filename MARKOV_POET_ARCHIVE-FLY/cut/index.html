<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYGWYL — five cuts, a concordance and a music map</title>
<style>
  :root{ --paper:#fff; --ink:#000; --dim:#6a6a6a; --soft:#f4f4f4; --hot:#cf222e; --hdr:#0a5; --claim:#8a6d00; }
  *{ box-sizing:border-box; margin:0; padding:0; border-radius:0 !important; }
  /* an explicit display: beats the UA sheet's [hidden]{display:none}, and #left is a flexbox */
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--paper); color:var(--ink);
        display:flex; flex-direction:column; }

  header{ flex:0 0 auto; z-index:50; background:var(--paper); border-bottom:2px solid var(--ink);
          padding:9px 14px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  .brand{ font-size:13px; font-weight:900; letter-spacing:.10em; }
  .sub{ color:var(--dim); }
  .tabs{ margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .tab{ border:1px solid var(--ink); background:#fff; padding:5px 11px; font:inherit; font-weight:800;
        text-transform:uppercase; font-size:11px; cursor:pointer; letter-spacing:.05em; }
  .tab[aria-selected="true"]{ background:var(--ink); color:#fff; }

  main{ flex:1 1 auto; min-height:0; display:grid;
        grid-template-columns:minmax(0,1.45fr) minmax(360px,1fr); }
  main.solo{ grid-template-columns:1fr; }
  @media (max-width:900px){
    body{ display:block; }
    main{ display:block; }
    #right{ border-left:0; border-top:2px solid var(--ink); }
  }

  #left{ padding:14px; display:flex; flex-direction:column; gap:9px; min-height:0; overflow-y:auto; }
  /* no scroll-behavior: the pane tracks a playhead, and an animated pane always lags it */
  #right{ border-left:2px solid var(--ink); background:var(--soft); overflow-y:auto; min-height:0; }
  #when{ padding:16px 18px; overflow-y:auto; min-height:0; }

  .screen{ width:100%; aspect-ratio:16/9; background:#000; border:2px solid var(--ink); }
  video{ width:100%; height:100%; display:block; object-fit:contain; background:#000; }

  .note{ color:var(--dim); border-left:3px solid var(--ink); padding-left:9px; }
  .bar{ display:flex; justify-content:space-between; gap:10px; align-items:center;
        border-bottom:1px solid var(--ink); padding-bottom:5px; font-size:11px; }
  .bar b{ font-weight:800; }
  .dl{ display:flex; gap:8px; flex-wrap:wrap; font-size:11px; }
  .dl a{ color:var(--ink); border:1px solid var(--ink); padding:2px 7px; text-decoration:none; }
  .dl a:hover{ background:var(--ink); color:#fff; }

  #strip{ position:relative; height:34px; border:1px solid var(--ink); background:#e9e9e9;
          cursor:crosshair; overflow:hidden; }
  .seg{ position:absolute; top:0; bottom:0; border-right:1px solid #b3b3b3; background:transparent; }
  .seg.hdr{ background:rgba(0,170,85,.18); }
  .seg.card{ background:rgba(0,0,0,.14); }
  .seg.flash{ background:rgba(207,34,46,.30); }
  .seg.on{ outline:2px solid var(--hot); outline-offset:-2px; }
  .ph{ position:absolute; top:0; bottom:0; width:2px; background:#000; opacity:.55; z-index:3; }
  #head{ position:absolute; top:0; bottom:0; width:2px; background:var(--hot); z-index:5; pointer-events:none; }
  .stripkey{ display:flex; gap:12px; color:var(--dim); font-size:10.5px; flex-wrap:wrap; }
  .sw{ display:inline-block; width:10px; height:10px; border:1px solid var(--ink); vertical-align:-1px; margin-right:4px; }

  .now{ display:grid; grid-template-columns:120px 1fr; gap:10px; align-items:start;
        border:1px solid var(--ink); background:#fff; padding:8px; }
  .now img{ width:120px; display:block; background:#000; }
  .now .k{ font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .now .v{ font-weight:800; }
  .now .vo{ font-style:italic; color:#222; margin-top:5px; }

  .poem{ border-bottom:1px solid #d5d5d5; }
  .phead{ background:var(--ink); color:#fff; padding:6px 11px; display:flex; justify-content:space-between;
          gap:8px; font-weight:800; letter-spacing:.05em; position:sticky; top:0; z-index:2; }
  .phead small{ font-weight:400; opacity:.7; }
  .verse{ padding:9px 11px; font-style:italic; background:#fff; border-bottom:1px solid #e6e6e6; color:#333; }
  .stanza{ padding:6px 11px; background:#fff; border-bottom:1px solid #efefef; }
  .stanza .sid{ font-size:10px; color:var(--dim); letter-spacing:.06em; }
  .stanza .stext{ font-weight:800; }
  .stanza .svo{ color:#444; font-style:italic; margin-top:2px; }
  .shots{ display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .chip{ border:1px solid var(--ink); background:#fff; padding:2px 6px; font-size:10.5px; cursor:pointer;
         white-space:nowrap; }
  .chip:hover{ background:var(--ink); color:#fff; }
  .chip.on{ background:var(--hot); color:#fff; border-color:var(--hot); }
  .chip.hdr::after{ content:" ·HDR"; color:var(--hdr); font-weight:800; }
  .chip.on.hdr::after{ color:#fff; }
  .empty{ color:var(--dim); padding:6px 11px; background:#fff; }

  /* ---- WHEN ---- */
  #when h2{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin:22px 0 6px; }
  #when h2:first-child{ margin-top:0; }
  #when p{ max-width:76ch; margin-bottom:8px; color:#222; }
  #when .lede{ border-left:3px solid var(--ink); padding-left:10px; }
  #when code{ background:var(--soft); padding:0 3px; }
  .ruler{ margin:6px 0 14px; max-width:1100px; }
  .ruler .rname{ font-weight:800; font-size:11px; letter-spacing:.05em; }
  .ruler .rhow{ color:var(--dim); font-size:10.5px; margin-bottom:3px; }
  .track{ position:relative; height:30px; border:1px solid var(--ink); background:#eee; }
  .blk{ position:absolute; top:0; bottom:0; border-right:1px solid #fff; overflow:hidden;
        font-size:9.5px; line-height:30px; text-align:center; color:#fff; font-weight:800; }
  .blk.q{ background:repeating-linear-gradient(45deg,#8a6d00,#8a6d00 4px,#a58314 4px,#a58314 8px); }
  .blk.bad{ outline:2px solid var(--hot); outline-offset:-2px; z-index:2; }
  .blk.gone{ background:#fff; color:var(--hot); border:1px dashed var(--hot); }
  table.cc{ border-collapse:collapse; font-size:11px; width:100%; max-width:1100px; margin:6px 0 16px; }
  table.cc th, table.cc td{ border:1px solid #ccc; padding:3px 6px; text-align:left; }
  table.cc th{ background:var(--ink); color:#fff; font-weight:800; }
  table.cc td.n{ text-align:right; }
  .flag{ color:var(--hot); font-weight:800; }
  details.cx{ border:1px solid var(--ink); margin:5px 0; background:#fff; max-width:1100px; }
  details.cx summary{ padding:5px 9px; cursor:pointer; font-weight:800; background:var(--soft); }
  details.cx .lines{ padding:8px 10px; display:grid; grid-template-columns:auto auto 1fr; gap:2px 10px; }
  details.cx .lines i{ color:var(--dim); font-style:normal; }
</style>
</head>
<body>

<header>
  <span class="brand">WYGWYL</span>
  <span class="sub">five cuts · 61 distinct pictures in 135 shots · 34 tracks measured</span>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="cutE" aria-selected="true">E · the door <i style="font-style:normal;opacity:.6">on the music</i></button>
    <button class="tab" role="tab" data-view="cutD" aria-selected="false">D · the door <i style="font-style:normal;opacity:.6">(silent)</i></button>
    <button class="tab" role="tab" data-view="cutB" aria-selected="false">B · the window and the door</button>
    <button class="tab" role="tab" data-view="cutA" aria-selected="false">A · the PQ reel</button>
    <button class="tab" role="tab" data-view="cutC" aria-selected="false">C · the deck 60&nbsp;bpm</button>
    <button class="tab" role="tab" data-view="when"  aria-selected="false">when · concordance</button>
  </div>
</header>

<main id="main">
  <section id="left">
    <div class="screen"><video id="v" controls playsinline preload="metadata"></video></div>
    <div class="bar">
      <span><b id="cutname">—</b> <span class="sub" id="cutlen"></span></span>
      <span class="sub" id="clock">00:00 / 00:00</span>
    </div>
    <div id="strip"><div id="head"></div></div>
    <div class="stripkey">
      <span><i class="sw" style="background:rgba(0,170,85,.35)"></i>HDR source</span>
      <span><i class="sw" style="background:rgba(0,0,0,.2)"></i>card</span>
      <span><i class="sw" style="background:rgba(207,34,46,.4)"></i>the reel (declared BREAK)</span>
      <span><i class="sw" style="background:#e9e9e9"></i>motion</span>
      <span id="phkey" hidden><i class="sw" style="background:#000"></i>phrase line (32 s)</span>
    </div>
    <div class="dl" id="dl"></div>
    <div class="now" id="now"><img id="nowimg" alt=""><div id="nowtxt"></div></div>
    <div class="note" id="note"></div>
  </section>

  <section id="right"><div id="script"></div></section>
  <section id="when" hidden></section>
</main>

<script>
const V=document.getElementById('v'), STRIP=document.getElementById('strip'),
      HEAD=document.getElementById('head'), SCRIPT=document.getElementById('script'),
      MAIN=document.getElementById('main'), WHEN=document.getElementById('when'),
      LEFT=document.getElementById('left'), RIGHT=document.getElementById('right');
let D=null, cut='cutE', segs=[], chips={}, cur=-1;
const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;

fetch('pagedata.json').then(r=>r.json()).then(d=>{ D=d; buildScript(); buildWhen(); show('cutE'); });
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.view));

function show(which){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.view===which));
  const isWhen = which==='when';
  LEFT.hidden = RIGHT.hidden = isWhen;
  WHEN.hidden = !isWhen;
  MAIN.classList.toggle('solo', isWhen);
  if(isWhen){ V.pause(); return; }
  load(which);
}

function load(which){
  cut = which;
  const c = D[which];
  if(!V.getAttribute('src') || !V.getAttribute('src').endsWith(c.file)) V.src = c.file;
  document.getElementById('cutname').textContent = c.name;
  document.getElementById('cutlen').textContent = `· ${c.shots.length} events · ${mmss(c.dur)}`
      + (c.bpm ? ` · ${c.bpm} bpm · ${Math.round(c.dur/c.phrase)} phrases` : '');
  document.getElementById('note').innerHTML = (c.track
    ? `<b>${c.track.title}</b> · ${c.track.album} · ${c.track.bpm} BPM · <a href="${c.track.page}" target="_blank" style="color:inherit">page</a> — <i>“${c.track.note}”</i><br>`
    : '') + c.note;
  document.getElementById('phkey').hidden = !c.phrases;
  document.getElementById('dl').innerHTML =
    [['picture + sound', c.file], c.silent&&['silent master (DJ)', c.silent],
     c.score&&['score stem .wav', c.score], c.cue&&['cue sheet', c.cue]]
    .filter(Boolean).map(([t,h])=>`<a href="${h}" download>${t}</a>`).join('');
  buildStrip(); markAvailability(); cur=-1; paint(0);
}

function buildStrip(){
  const c = D[cut];
  STRIP.querySelectorAll('.seg,.ph').forEach(n=>n.remove());
  segs = c.shots.map((s,i)=>{
    const el=document.createElement('div');
    el.className='seg '+(s.kind==='flash'?'flash':s.kind==='card'?'card':'')+(s.hdr?' hdr':'');
    el.style.left=(100*s.t/c.dur)+'%'; el.style.width=Math.max(0.15,100*s.d/c.dur)+'%';
    el.title=`${s.patch} · ${s.stanza} · ${s.cls} · ${s.d.toFixed(2)}s`;
    el.onclick=ev=>{ ev.stopPropagation(); V.currentTime=s.t+.05; };
    STRIP.appendChild(el); return el;
  });
  (c.phrases||[]).forEach(p=>{
    const m=document.createElement('div'); m.className='ph';
    m.style.left=(100*p.t/c.dur)+'%'; m.title=`phrase ${p.i} — ${p.num} ${p.title}`;
    STRIP.appendChild(m);
  });
}
STRIP.onclick = e => { const r=STRIP.getBoundingClientRect();
  V.currentTime = D[cut].dur*(e.clientX-r.left)/r.width; };

function buildScript(){
  SCRIPT.innerHTML='';
  D.poems.forEach(p=>{
    const cx = D.concordance.codex.poems.find(x=>x.number===p.n);
    const box=document.createElement('div'); box.className='poem';
    box.innerHTML=`<div class="phead">${p.n} ${p.title}<small>${p.stanzas.length} stanzas · `
      + (cx&&cx.codex_in!=null ? `CODEX ${mmss(cx.codex_in)}` : `no CODEX`) + `</small></div>
      <div class="verse">${p.verse}</div>`;
    p.stanzas.forEach(st=>{
      const d=document.createElement('div'); d.className='stanza';
      d.innerHTML=`<div class="sid">${st.id} · ${st.kind} · ${st.fn}</div>
                   <div class="stext">${st.text}</div>`
        + (st.vo?`<div class="svo">${st.vo}</div>`:'')
        + `<div class="shots" data-for="${st.id}"></div>`;
      box.appendChild(d);
    });
    SCRIPT.appendChild(box);
  });
}

function markAvailability(){
  chips={}; SCRIPT.querySelectorAll('.shots').forEach(n=>n.innerHTML='');
  D[cut].shots.forEach((s,i)=>{
    const host=SCRIPT.querySelector(`.shots[data-for="${s.stanza}"]`); if(!host) return;
    const b=document.createElement('button');
    b.className='chip'+(s.hdr?' hdr':'');
    b.textContent=s.patch+(s.kind==='flash'?' ⟨'+s.label+'⟩':'');
    b.title=`${s.cls} · ${s.d.toFixed(2)}s @ ${mmss(s.t)}`;
    b.onclick=()=>{ V.currentTime=s.t+.05; V.play(); };
    host.appendChild(b); chips[i]=b;
  });
  SCRIPT.querySelectorAll('.stanza').forEach(st=>{
    const h=st.querySelector('.shots');
    if(!h.children.length) h.innerHTML='<span class="empty">— not in this cut —</span>';
  });
}

function paint(t){
  const c=D[cut];
  HEAD.style.left=(100*t/c.dur)+'%';
  document.getElementById('clock').textContent=`${mmss(t)} / ${mmss(c.dur)}`;
  let i=c.shots.findIndex(s=>t>=s.t && t<s.t+s.d);
  if(i<0) i = t>=c.dur ? c.shots.length-1 : 0;
  if(i===cur) return;
  if(cur>=0){ segs[cur]?.classList.remove('on'); chips[cur]?.classList.remove('on'); }
  cur=i; segs[i]?.classList.add('on');
  const ch=chips[i];
  if(ch){ ch.classList.add('on');
    const top = ch.getBoundingClientRect().top - RIGHT.getBoundingClientRect().top + RIGHT.scrollTop;
    RIGHT.scrollTop = top - RIGHT.clientHeight/2; }
  const s=c.shots[i], poem=D.poems.find(p=>p.n===s.stanza.slice(0,2)),
        stz=poem?.stanzas.find(x=>x.id===s.stanza);
  document.getElementById('nowimg').src=s.thumb;
  document.getElementById('nowtxt').innerHTML=
    `<div class="k">${s.stanza} · ${poem?poem.title:''}</div>
     <div class="v">${stz?stz.text:''}</div>
     <div class="k" style="margin-top:5px">${s.patch} · ${s.cls} · ${s.d.toFixed(2)}s${s.hdr?' · HDR SOURCE':''}${s.kind==='flash'?' · REEL: '+s.label:''}</div>
     ${stz&&stz.vo?`<div class="vo">${stz.vo}</div>`:''}`;
}
V.addEventListener('timeupdate',()=>{ if(!LEFT.hidden) paint(V.currentTime); });
V.addEventListener('seeked',    ()=>{ if(!LEFT.hidden) paint(V.currentTime); });
addEventListener('keydown',e=>{
  if(LEFT.hidden || e.target.tagName==='BUTTON') return;
  const c=D[cut];
  if(e.key==='ArrowRight'){ e.preventDefault(); V.currentTime=(c.shots[cur+1]||c.shots[cur]).t+.05; }
  if(e.key==='ArrowLeft'){  e.preventDefault(); V.currentTime=(c.shots[Math.max(0,cur-1)]).t+.05; }
  if(e.key===' '){ e.preventDefault(); V.paused?V.play():V.pause(); }
});

/* ------------------------------------------------------------------ WHEN -- */
const HUE = n => `hsl(${(parseInt(n,10)*27)%360} 55% 38%)`;

function ruler(name, how, total, blocks){
  const b = blocks.map(x =>
    x.gone
      ? `<div class="blk gone" style="left:${100*x.a/total}%;width:${100*(x.b-x.a)/total}%" title="${x.label}">${x.num}</div>`
      : `<div class="blk${x.q?' q':''}${x.bad?' bad':''}" title="${x.label}"
           style="left:${100*x.a/total}%;width:${100*(x.b-x.a)/total}%;${x.q?'':'background:'+HUE(x.num)}">${x.num}</div>`
  ).join('');
  return `<div class="ruler"><div class="rname">${name}</div><div class="rhow">${how}</div>
          <div class="track">${b}</div></div>`;
}

function buildWhen(){
  const C = D.concordance;
  const P = C.codex.poems.slice().sort((a,b)=>a.number.localeCompare(b.number));
  const inCodex = P.filter(p=>p.codex_in!=null);
  const codexTot = C.codex.duration;
  const contTot  = Math.max(...P.map(p=>p.container_claimed[1]));
  const bTot     = Math.max(...P.map(p=>p.cut_b_out));
  const deckTot  = D.cutC.dur;

  const rows = [
    ruler('CODEX — measured',
      `OCR of 1768 one-second samples of the burned-in header. 13 poems, each exactly ${C.codex.span}s, `
      + `${C.codex.gap}s of black between. Total ${codexTot.toFixed(1)}s. NEW DAY is not in it.`,
      codexTot,
      inCodex.map(p=>({num:p.number, a:p.codex_in, b:p.codex_out,
        label:`${p.number} ${p.title} — ${mmss(p.codex_in)}–${mmss(p.codex_out)} · ${p.codex_frames} codex frames`}))),

    ruler('BURNED — fitted, and wrong twice',
      'the clock the CODEX draws on itself, fitted as t = slot·131 + (frame−1)·rate, max residual 1.7 s. '
      + 'Agrees with playback for 11 of 13.',
      13*131,
      inCodex.map(p=>({num:p.number, a:Math.round(p.burned_slot)*131, b:(Math.round(p.burned_slot)+1)*131,
        bad:!p.burned_agrees_with_playback,
        label:`${p.number} ${p.title} — burns slot ${p.burned_slot.toFixed(2)}, plays at position ${p.playback_position}`
             + (p.burned_agrees_with_playback ? '' : '  ✗ DISAGREES')}))),

    ruler('CONTAINER — claimed, not measured',
      'the ranges asserted by wygwyl_suite_mapping.json: 14 poems over 1440.07 s. Nothing in this repo '
      + 'reproduces them and they do not match the CODEX. Hatched because nothing verifies them.',
      contTot,
      P.map(p=>({num:p.number, a:p.container_claimed[0], b:p.container_claimed[1], q:true,
        label:`${p.number} ${p.title} — ${p.container_claimed[0].toFixed(1)}–${p.container_claimed[1].toFixed(1)}s (claimed)`}))),

    ruler('CUT B — the window and the door',
      'where our own story cut puts each poem. Derived from the stanza routing; found in no source.',
      bTot,
      P.map(p=>({num:p.number, a:p.cut_b_in, b:p.cut_b_out,
        label:`${p.number} ${p.title} — ${mmss(p.cut_b_in)}–${mmss(p.cut_b_out)} · ${p.cut_b_shots} shots`}))),

    ruler('CUT C — the deck, 60 bpm',
      'one 32-second phrase per poem, three for HOT MINUTE. Every poem starts on a phrase line by construction.',
      deckTot,
      D.cutC.phrases.map((ph,i)=>({num:ph.num, a:ph.t,
        b:(D.cutC.phrases[i+1] ? D.cutC.phrases[i+1].t : deckTot),
        label:`${ph.num} ${ph.title} — phrase ${ph.i}, ${mmss(ph.t)}`}))),
  ].join('');

  const table = `<table class="cc"><tr><th>#</th><th>poem</th><th>CODEX in–out</th><th class="n">codex frames</th>
    <th class="n">burned slot</th><th>agrees</th><th>CONTAINER (claimed)</th><th>CUT B</th><th>CUT C phrase</th></tr>`
    + P.map(p=>{
        const ph = D.cutC.phrases.find(x=>x.num===p.number);
        return `<tr><td>${p.number}</td><td>${p.title}</td>
          <td>${p.codex_in!=null?`${mmss(p.codex_in)}–${mmss(p.codex_out)}`:'<span class="flag">absent</span>'}</td>
          <td class="n">${p.codex_frames||'—'}</td>
          <td class="n">${p.burned_slot!=null?p.burned_slot.toFixed(2):'—'}</td>
          <td>${p.burned_slot==null?'—':(p.burned_agrees_with_playback?'✓':'<span class="flag">✗</span>')}</td>
          <td>${p.container_claimed[0].toFixed(1)}–${p.container_claimed[1].toFixed(1)}s</td>
          <td>${mmss(p.cut_b_in)}–${mmss(p.cut_b_out)}</td>
          <td>${ph?mmss(ph.t):'—'}</td></tr>`;
      }).join('') + `</table>`;

  const lines = P.filter(p=>p.lines.length).map(p=>`
    <details class="cx"><summary>${p.number} ${p.title} — ${p.lines.length} codex lines, ${mmss(p.codex_in)}–${mmss(p.codex_out)}</summary>
      <div class="lines">${p.lines.map(l=>`<i>${l.f}</i><i>${mmss(l.at)}</i><span>${(l.line||'').replace(/</g,'&lt;')}</span>`).join('')}</div>
    </details>`).join('');

  WHEN.innerHTML = `
    <h2>Which poem, when</h2>
    <p class="lede">Four reference frames exist for <em>where a poem is</em>, and they do not agree. Each is drawn
    below on its own axis, with how it was obtained. None has been averaged into the others.</p>

    <h2>The rulers</h2>
    <p>Each ruler is its own 0–100 %. Blocks are poems, numbered. Hatched means claimed but unverified;
    a red outline means that frame contradicts itself.</p>
    ${rows}

    <h2>Two findings that change the earlier work</h2>
    <p><b>NEW DAY is not in the CODEX.</b> The archive's suite has fourteen poems; the source film has thirteen.
    Remove <code>11 NEW DAY</code> from the archive's order and the two lists match poem for poem, in sequence —
    so the archive's numbering is right and the CODEX is the same film with one poem missing, not a different edit
    with a different order.</p>
