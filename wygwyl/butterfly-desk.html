<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE PACING DESK</title>
<style>
:root{--bg:#0a0a0c;--line:#26261f;--ink:#e3ddc8;--dim:#8f8a74;--faint:#55523f;
  --gold:#e8c34a;--teal:#4dd9cc;--rose:#e05c4f;--green:#9ee06a;--viol:#c86bd9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:12.5px/1.5 "SF Mono",Menlo,monospace;overflow:hidden}
a{color:var(--teal);text-decoration:none}
#wrap{display:flex;flex-direction:column;height:100%}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
video{max-width:100%;max-height:100%}
#tl{height:118px;cursor:crosshair;display:block;width:100%}
#bar{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
#bar h1{font-size:12px;letter-spacing:.24em;color:var(--gold);margin-right:6px}
button{background:#141410;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:11px;
  padding:4px 12px;border-radius:4px;cursor:pointer;letter-spacing:.08em}
button:hover{border-color:var(--gold)}
button.on{background:var(--gold);color:#0a0a0c;border-color:var(--gold)}
button.play{min-width:74px}
input[type=range]{width:90px;accent-color:var(--gold)}
#status{color:var(--dim);font-size:10.5px;margin-left:auto;max-width:44ch;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label{color:var(--faint);font-size:10px;display:flex;gap:5px;align-items:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><video id="v" src="../film/BUTTERFLY.mp4" preload="metadata" playsinline></video></div>
  <canvas id="tl"></canvas>
  <div id="bar">
    <h1>THE PACING DESK</h1>
    <button id="play" class="play">▶ PLAY</button>
    <label>film <input id="fvol" type="range" min="0" max="100" value="90"></label>
    <button id="r-beds" class="on">SCENE BEDS</button>
    <button id="r-hits" class="on">HITS ON CUTS</button>
    <button id="r-whisp" class="on">ATLANTIS WHISPERS</button>
    <button id="r-duck" class="on">DUCK FILM</button>
    <button id="export">⬇ SCORE</button>
    <span id="status">loading the cue sheet…</span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const v = $('#v'), tl = $('#tl');
let CUE = null, EVENTS = [], ctx = null, buffers = new Map(), scheduled = new Set();
let bedNow = null, bedNodes = null;
const R = {beds: true, hits: true, whisp: true, duck: true};

// ── the rules: place our audio only where the film's actions call for it ──
function generate(){
  EVENTS = [];
  if (!CUE) return;
  if (R.beds)
    for (const sc of CUE.scenes)
      if (sc.bed) EVENTS.push({t: sc.t0, dur: sc.dur, kind: 'bed', file: sc.bed.file,
                               label: `${sc.id} · ${sc.bed.name}`, gain: 0.13});
  if (R.hits){
    // the cut is the trigger; the hit lands there if the voice is silent,
    // otherwise it snaps to the next breath (silence within 3s) and answers
    let last = -99, prevKind = null, i = 0;
    const cands = [];
    for (const c of CUE.cuts){
      if (prevKind && c.kind !== prevKind) cands.push({t: c.t, why: c.kind + ' cut'});
      prevKind = c.kind;
    }
    for (const sc of CUE.scenes)
      if (!sc.card) cands.push({t: sc.t0, why: 'scene ' + sc.id});
    cands.sort((a, b) => a.t - b.t);
    for (const c of cands){
      if (c.t - last < 7) continue;
      let at = null;
      const inside = CUE.silences.find(s => c.t >= s.t0 + 0.2 && c.t <= s.t0 + s.dur - 0.8);
      if (inside) at = c.t;
      else { const next = CUE.silences.find(s => s.t0 >= c.t && s.t0 <= c.t + 3.0 && s.dur >= 1.0);
             if (next) at = next.t0 + 0.12; }
      if (at == null) continue;
      const h = CUE.pools.hits[i++ % CUE.pools.hits.length];
      EVENTS.push({t: +at.toFixed(2), dur: Math.min(h.dur, 2.2), kind: 'hit', file: h.file,
                   label: `${c.why} · ${h.label}`, gain: 0.42, pan: i % 2 ? 0.4 : -0.4});
      last = at;
    }
  }
  if (R.whisp){
    let last = -99, i = 0;
    for (const s of CUE.silences){
      if (s.dur < 3.5 || s.t0 - last < 18) continue;
      const w = CUE.pools.whispers[(i * 7) % CUE.pools.whispers.length]; i++;
      if (w.dur > s.dur - 0.8) continue;
      EVENTS.push({t: s.t0 + 0.5, dur: Math.min(w.dur, 6), kind: 'whisper', file: w.file,
                   label: `“${w.text}”`, gain: 0.5, pan: i % 2 ? 0.35 : -0.35, duck: true});
      last = s.t0;
    }
  }
  EVENTS.sort((a, b) => a.t - b.t);
  draw();
  $('#status').textContent = EVENTS.filter(e=>e.kind=='bed').length + ' beds · ' +
    EVENTS.filter(e=>e.kind=='hit').length + ' hits · ' +
    EVENTS.filter(e=>e.kind=='whisper').length + ' whispers of the poet';
}

// ── audition: sample-accurate against the film clock ──
async function buf(file){
  if (buffers.has(file)) return buffers.get(file);
  const p = fetch(file).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)).catch(() => null);
  buffers.set(file, p);
  return p;
}
function playEvent(ev, when){
  buf(ev.file).then(b => {
    if (!b || v.paused) return;
    const src = ctx.createBufferSource(); src.buffer = b;
    const g = ctx.createGain(); g.gain.value = ev.gain;
    const pan = ctx.createStereoPanner(); pan.pan.value = ev.pan || 0;
    src.connect(g); g.connect(pan); pan.connect(ctx.destination);
    const at = Math.max(ctx.currentTime, when);
    const dur = Math.min(ev.dur, b.duration);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(ev.gain, at + 0.06);
    g.gain.setValueAtTime(ev.gain, at + dur - 0.3); g.gain.linearRampToValueAtTime(0, at + dur);
    src.start(at, 0, dur + 0.05);
    if (ev.duck && R.duck){
      const back = $('#fvol').value / 100;
      setTimeout(() => v.volume = back * 0.42, (at - ctx.currentTime) * 1000);
      setTimeout(() => v.volume = back, (at - ctx.currentTime + dur) * 1000);
    }
    $('#status').textContent = ev.kind.toUpperCase() + ' · ' + ev.label;
  });
}
function bed(sc){                         // one bed at a time, crossfaded by hand
  if (bedNow === sc?.id) return;
  if (bedNodes){ const old = bedNodes;
    old.g.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
    setTimeout(() => { try{ old.src.stop(); }catch(e){} }, 1400); bedNodes = null; }
  bedNow = sc?.id || null;
  const ev = sc && EVENTS.find(e => e.kind === 'bed' && e.t === sc.t0);
  if (!ev) return;
  buf(ev.file).then(b => {
    if (!b || v.paused || bedNow !== sc.id) return;
    const src = ctx.createBufferSource(); src.buffer = b; src.loop = true;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(g); g.connect(ctx.destination);
    g.gain.linearRampToValueAtTime(ev.gain, ctx.currentTime + 1.5);
    src.start(); bedNodes = {src, g};
  });
}
function tick(){
  if (!CUE || v.paused) return;
  const t = v.currentTime;
  for (const ev of EVENTS){
    if (ev.kind === 'bed') continue;
    if (ev.t < t - 0.05 || ev.t > t + 1.2) continue;
    const key = ev.kind + ev.t;
    if (scheduled.has(key)) continue;
    scheduled.add(key);
    playEvent(ev, ctx.currentTime + (ev.t - t));
  }
  bed(R.beds ? CUE.scenes.find(s => s.bed && t >= s.t0 && t < s.t0 + s.dur) : null);
  draw();
}
setInterval(tick, 250);
function resetSched(){ scheduled.clear(); bed(null); }

// ── the strip: scenes, cuts, the voice, the placed score, the playhead ──
function draw(){
  const d = Math.min(devicePixelRatio || 1, 2);
  if (tl.width !== innerWidth * d){ tl.width = innerWidth * d; tl.height = 118 * d;
    tl.getContext('2d').setTransform(d, 0, 0, d, 0, 0); }
  const g = tl.getContext('2d'), W = innerWidth, T = CUE ? CUE.total : 1;
  const X = t => t / T * W;
  g.fillStyle = '#0a0a0c'; g.fillRect(0, 0, W, 118);
  if (!CUE) return;
  for (let i = 0; i < CUE.scenes.length; i++){          // SCREEN — scene bands + cuts
    const sc = CUE.scenes[i];
    g.fillStyle = sc.card ? '#101014' : (i % 2 ? '#15151a' : '#191920');
    g.fillRect(X(sc.t0), 6, X(sc.dur), 30);
  }
  for (const c of CUE.cuts){
    g.strokeStyle = c.kind === 'close' ? '#e8c34a99' : '#8f8a7466';
    g.beginPath(); g.moveTo(X(c.t), 6); g.lineTo(X(c.t), c.kind === 'close' ? 36 : 26); g.stroke();
  }
  for (const s of CUE.silences){                        // VOICE — lines + silences
    g.fillStyle = '#4dd9cc12'; g.fillRect(X(s.t0), 44, X(s.dur), 26);
  }
  for (const L of CUE.lines){
    g.fillStyle = '#4dd9ccbb'; g.fillRect(X(L.t0), 48, Math.max(X(L.dur), 1.5), 18);
  }
  const KC = {bed: '#9ee06a', hit: '#e05c4f', whisper: '#c86bd9'};   // SCORE
  for (const ev of EVENTS){
    g.fillStyle = KC[ev.kind];
    if (ev.kind === 'bed'){ g.globalAlpha = 0.35; g.fillRect(X(ev.t), 96, X(ev.dur), 8); g.globalAlpha = 1; }
    else { g.beginPath(); g.arc(X(ev.t), 88, ev.kind === 'whisper' ? 4.5 : 3.5, 0, 7); g.fill(); }
  }
  g.fillStyle = '#55523f';
  g.fillText('SCREEN', 6, 20); g.fillText('VOICE', 6, 62); g.fillText('SCORE', 6, 92);
  g.strokeStyle = '#e3ddc8'; g.lineWidth = 1.2;                       // playhead
  g.beginPath(); g.moveTo(X(v.currentTime), 0); g.lineTo(X(v.currentTime), 118); g.stroke();
}
tl.addEventListener('pointerdown', e => {
  if (!CUE) return;
  v.currentTime = e.clientX / innerWidth * CUE.total;
  resetSched(); draw();
});
addEventListener('resize', draw);

// ── transport + toggles ──
$('#play').onclick = () => {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  if (v.paused){ v.play(); $('#play').textContent = '❚❚'; }
  else { v.pause(); $('#play').textContent = '▶ PLAY'; }
};
v.addEventListener('pause', () => { $('#play').textContent = '▶ PLAY'; bed(null);
  if (bedNodes){ try{ bedNodes.src.stop(); }catch(e){} bedNodes = null; } });
v.addEventListener('seeked', resetSched);
$('#fvol').oninput = e => v.volume = e.target.value / 100;
v.volume = 0.9;
for (const key of ['beds', 'hits', 'whisp', 'duck'])
  $('#r-' + key).onclick = e => { R[key] = !R[key];
    e.target.classList.toggle('on', R[key]); resetSched(); generate(); };
$('#export').onclick = () => {
  const clips = EVENTS.map(ev => ({at: +ev.t.toFixed(2), source: ev.file, s: 0,
    e: +(ev.dur).toFixed(2), gain: ev.gain, fadeIn: ev.kind === 'bed' ? 1.5 : 0.06,
    fadeOut: ev.kind === 'bed' ? 2 : 0.3, label: ev.label.slice(0, 40),
    ref: {kind: ev.kind, film: 'BUTTERFLY'}}));
  const score = {fresco: '0.1', title: 'BUTTERFLY — the atlantis pacing', duration: CUE.total,
    base: '', tracks: [{id: 'pace', name: 'THE PACING', gain: 1, clips}], lanes: [],
    provenance: {generator: 'butterfly-desk.html', rules: {...R}}};
  const url = URL.createObjectURL(new Blob([JSON.stringify(score, null, 1)], {type: 'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = 'butterfly-pacing.fresco.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
};

fetch('cues/butterfly.json', {cache: 'no-cache'}).then(r => r.json()).then(j => {
  CUE = j; generate();
}).catch(e => $('#status').textContent = 'cues missing — run _dig/butterfly_cues.py · ' + e);
</script>
</body>
</html>
