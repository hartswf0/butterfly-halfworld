<!doctype html>
<meta charset="utf-8">
<title>disposable proxy — footage pipeline test, not shipped</title>
<link rel="stylesheet" href="halfworld.css">
<style>#stagewrap{position:relative;width:960px;height:720px}#stage{position:absolute;inset:0}</style>
<div id="stagewrap"><canvas id="stage"></canvas></div>
<script type="module">
/* DISPOSABLE — verifies ingest.mjs + blend.mjs + the figureLockTorn composite
   against REAL EXTRACTED STILL FRAMES, standing in for a <video> this
   sandbox's Chromium cannot decode (see EXPERIMENTS.md / BLEND-NOTES.md).
   Same pattern as dj.html: an <img>, ingest.mjs's naturalWidth fallback,
   the real sample() call. Deleted once the sweep is done. */
import { FW, FH, makeRuntime, makePost } from "./halfworld.mjs";
import world, { footage } from "./worlds/01b-out-of-life-blend.mjs";
import { makeIngest } from "./ingest.mjs";
import { swap, wipe, byLevel, noiseSwap, figureLock } from "./blend.mjs";

/* one <img>, but always reloaded through a cache-busting query string — an
   <img>'s `load` event does not refire when `src` is reassigned the SAME
   value, which silently left every repeat call in this harness sampling a
   stale (sometimes undecoded, all-zero) frame. Found by looking: five
   different ingest opts against the same still produced five IDENTICAL
   screenshots, which is the tell. */
const img = document.createElement("img");
document.body.appendChild(img);
const canvas = document.getElementById("stage");
const post = makePost(canvas, world.accent);
post.fit(960, 720, 1);
const R = makeRuntime(world);
const ingest = makeIngest(img);
const fieldA = new Float32Array(FW * FH);
let loadSeq = 0;

function figureLockTorn(a, b, t, o = {}) {
  const torn = noiseSwap(a, b, t, o.s ?? 0.4, o.opts || {});
  const threshold = o.threshold ?? 3.5;
  const out = new Float32Array(FW * FH);
  for (let q = 0; q < FW * FH; q++) out[q] = b[q] >= threshold ? b[q] : torn[q];
  return out;
}
function applyBlend(name, a, b, t, blendOpts = {}) {
  switch (name) {
    case "wipe": return wipe(a, b, t, blendOpts.angle ?? 0, blendOpts.opts || {});
    case "byLevel": return byLevel(a, b, t, !!blendOpts.reverse);
    case "noiseSwap": return noiseSwap(a, b, t, blendOpts.s ?? 0.4, blendOpts.opts || {});
    case "figureLock": return figureLock(a, b, t, blendOpts.threshold ?? 3.5);
    case "figureLockTorn": return figureLockTorn(a, b, t, blendOpts);
    case "swap": default: return swap(a, b, t);
  }
}
function loadImg(src) {
  return new Promise((res, rej) => {
    img.onload = res; img.onerror = rej;
    img.src = src + (src.includes("?") ? "&" : "?") + "_=" + (loadSeq++);
  });
}

/* movIdx: 1..4 (matches R.movements index). u: 0..1 within that movement.
   segIdx: which segment of footage.movements[movIdx-1].segments to force
   (so the test can hit a segment even at a u where another segment would
   normally own it — this is a picture-quality probe, not a timing probe).
   frameSrc: path to the still standing in for the video frame at this u. */
window.__proxy = {
  async render(movIdx, u, segIdx, frameSrc, mixOverride) {
    await loadImg(frameSrc);
    const t = R.starts[movIdx] + u * world.movements[movIdx - 1].seconds;
    const drawn = R.renderField(t);
    const seg = footage.movements[movIdx - 1].segments[segIdx];
    ingest.sample(fieldA, seg.opts);
    const p = mixOverride !== undefined ? mixOverride
      : (() => { const local = (u - seg.u0) / ((seg.u1 - seg.u0) || 1e-6); return local; })();
    const mixT = seg.mix ? seg.mix(Math.max(0, Math.min(1, p))) : p;
    const out = applyBlend(seg.blend, fieldA, drawn, Math.max(0, Math.min(1, mixT)), seg.blendOpts);
    post.draw(out);
    return { t, mixT, blend: seg.blend, opts: seg.opts };
  },
  async renderRaw(movIdx, u, frameSrc, opts, blend, blendOpts, mixT) {
    await loadImg(frameSrc);
    const t = R.starts[movIdx] + u * world.movements[movIdx - 1].seconds;
    const drawn = R.renderField(t);
    ingest.sample(fieldA, opts);
    const out = applyBlend(blend, fieldA, drawn, mixT, blendOpts || {});
    post.draw(out);
    return { t };
  },
};
window.__ready = true;
</script>
