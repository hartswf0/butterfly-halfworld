<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawings Taken Apart</title>
<meta name="description" content="Our footage through wygwyl-world-arch's drawing pipeline: every shot redrawn as flat shapes in its own colours, plane by plane, sky to foreground.">
<style>
:root{--bg:#0a0d18;--panel:#11152a;--line:rgba(255,255,255,.12);--ink:#eef0f7;--mute:#8b93ad;--acc:#f2a541;--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:"Avenir Next","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
#app{display:grid;grid-template-columns:300px 1fr;height:100%}
#side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side h1{font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:16px 16px 8px}
#dist{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
#dist button,.chips button{font:500 11px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mute);cursor:pointer}
#dist button.on,.chips button.on{color:#0a0d18;background:var(--acc);border-color:var(--acc)}
#grid{overflow:auto;padding:0 10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
#grid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;cursor:pointer;display:block;border:2px solid transparent;background:#000}
#grid img.on{border-color:var(--acc)}
#count{font:11px var(--mono);color:var(--mute);padding:0 16px 8px}
#main{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:0;padding:22px 28px 22px}
.head{font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.wrap{position:relative;display:grid;place-items:center;perspective:1600px;min-height:0}
.xcam{position:relative;width:min(100%,calc((100vh - 300px) * 1.78));aspect-ratio:16/9;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.xcam img{position:absolute;display:block;max-width:none;pointer-events:none;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .35s}
.xframe{position:absolute;inset:0;border:1px dashed rgba(255,255,255,.55);pointer-events:none;transform:translateZ(1px)}
.xframe::before{content:"camera frame";position:absolute;left:6px;top:-18px;font:10px var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.7)}
.cap{max-width:780px;min-height:120px}
.cap small{display:block;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.cap h2{margin:4px 0 6px;font:400 clamp(26px,4vw,44px)/1.1 var(--sans)}
.cap p{margin:0;color:#c5cbe0;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta{font:11px var(--mono);color:var(--mute);margin-top:8px}
@media (max-width:820px){html,body{overflow:auto}#app{grid-template-columns:1fr;height:auto}#side{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}#main{padding:16px}.xcam{width:100%}}
</style>
</head>
<body>
<div id="app">
  <aside id="side"><h1>Our footage · drawn</h1><div id="dist"></div><div id="count"></div><div id="grid"></div></aside>
  <main id="main">
    <div class="head" id="head"></div>
    <div class="wrap"><div class="xcam" id="xcam"></div></div>
    <div class="cap"><small id="k"></small><h2 id="h"></h2><p id="p"></p><div class="chips" id="chips"></div><div class="meta" id="meta"></div></div>
  </main>
</div>
<script src="landing/manifest.js"></script>
<script>
(function () {
  'use strict';
  var L = window.LANDING || {}, $ = function (s) { return document.querySelector(s); };
  var NAMES = {naraka: 'Naraka Market', haze: 'The Orange Haze', hive: 'The Hive', overseer: 'The Overseer', bay: 'Mirror Thread Bay', commons: 'Cortex Commons', plaza: 'The Light Gate & Central Plaza', ankhu: 'Ankhu Spires', cenotaph: 'Cenotaph Rail', arcade: 'The Shrouded Arcade', temple: 'The White Temple', ascent: 'The Ascent'};
  // their words for each sheet (wygwyl-world-arch index.html)
  var DESC = {P6: 'never moves; the camera cannot touch the sky', P5: 'barely drifts, far away', P4: 'the midground, slides with the camera', P3: 'secondary action and effects', P2: 'the action itself, the reference speed', P1: 'foreground, moves faster than the frame', P0: 'the mask nearest the lens'};
  var keys = Object.keys(L).sort(), dist = 'all', cur = null, hi = -1, X = [];
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); };
  var ds = {}; keys.forEach(function (k) { var d = L[k].district || '-'; ds[d] = (ds[d] || 0) + 1; });
  $('#dist').innerHTML = ['all'].concat(Object.keys(ds).sort()).map(function (d) { return '<button data-d="' + d + '"' + (d === dist ? ' class="on"' : '') + '>' + (d === 'all' ? 'all ' + keys.length : esc(d) + ' ' + ds[d]) + '</button>'; }).join('');
  function list() { return keys.filter(function (k) { return dist === 'all' || L[k].district === dist; }); }
  function grid() {
    var ks = list(); $('#count').textContent = ks.length + ' drawings';
    $('#grid').innerHTML = ks.map(function (k) { return '<img loading="lazy" data-k="' + k + '" src="' + L[k].poster + '" alt="' + k + '"' + (k === cur ? ' class="on"' : '') + '>'; }).join('');
  }
  function open(k) {
    cur = k; var m = L[k], cam = $('#xcam'); cam.innerHTML = ''; hi = -1;
    X = m.planes.map(function (p) {
      var im = new Image(); im.alt = p.name; im.decoding = 'async'; im.draggable = false; im.src = p.src;
      im.style.left = (-m.padx / m.w * 100) + '%'; im.style.top = (-m.pady / m.h * 100) + '%';
      im.style.width = ((m.w + 2 * m.padx) / m.w * 100) + '%'; im.style.height = ((m.h + 2 * m.pady) / m.h * 100) + '%';
      cam.appendChild(im); return im;
    });
    var fr = document.createElement('div'); fr.className = 'xframe'; cam.appendChild(fr);
    $('#head').textContent = (NAMES[m.district] || m.district || '') + ' · the same drawing, taken apart · ' + k;
    $('#chips').innerHTML = '<button data-i="-2">drawing</button><button data-i="-1">apart</button>' + m.planes.map(function (p, i) { return '<button data-i="' + i + '">' + p.id + '</button>'; }).join('');
    var sc = m.score || {};
    $('#meta').textContent = [m.source, m.kind, m.poem ? 'poem ' + m.poem : '', m.place != null ? 'recurring place #' + (m.place + 1) : '', sc.dE != null ? 'ΔE ' + sc.dE + ' · value SSIM ' + sc.value_ssim + ' · ' + sc.shapes + ' shapes' : '', (m.labels || []).join(', ')].filter(Boolean).join(' · ');
    [].forEach.call(document.querySelectorAll('#grid img'), function (e) { e.classList.toggle('on', e.dataset.k === k); });
    show(-1);
  }
  function show(i) {                                         // -2 the drawing whole · -1 taken apart · 0..n-1 one sheet lit
    hi = i; var m = L[cur], n = X.length, e = i === -2 ? 0 : 1, cam = $('#xcam'), W = cam.clientWidth, step = W * .085;
    cam.style.transform = 'rotateX(' + (9 * e) + 'deg) rotateY(' + (-27 * e) + 'deg) scale(' + (1 - .08 * e) + ')';
    for (var j = 0; j < n; j++) { X[j].style.transform = 'translateZ(' + ((j - (n - 1) / 2) * step * e).toFixed(1) + 'px)'; X[j].style.opacity = i >= 0 && j !== i ? '.1' : '1'; }
    [].forEach.call(document.querySelectorAll('#chips button'), function (b) { b.classList.toggle('on', +b.dataset.i === i); });
    if (i === -2) { $('#k').textContent = '01 · the drawing'; $('#h').textContent = 'One cartoon.'; $('#p').textContent = 'Flat shapes in the shot’s own colours, one per region, no outlines.'; }
    else if (i === -1) { $('#k').textContent = '02 · taken apart'; $('#h').textContent = 'It was never one picture.'; $('#p').textContent = n + ' sheets of drawing, stacked far to near. The dashed frame is the camera; the paint outside it is what the camera will uncover.'; }
    else { var pl = m.planes[i]; $('#k').textContent = pl.id + ' · moves ' + pl.par.toFixed(2) + '× the camera'; $('#h').textContent = pl.name; $('#p').textContent = DESC[pl.id] || ''; }
  }
  $('#dist').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; dist = b.dataset.d; [].forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); }); grid(); };
  $('#grid').onclick = function (e) { if (e.target.dataset.k) open(e.target.dataset.k); };
  $('#chips').onclick = function (e) { var b = e.target.closest('button'); if (b) show(+b.dataset.i); };
  addEventListener('keydown', function (e) {
    if (!cur) return; var ks = list(), at = ks.indexOf(cur), n = X.length;
    if (e.key === 'ArrowRight') open(ks[(at + 1) % ks.length]); else if (e.key === 'ArrowLeft') open(ks[(at - 1 + ks.length) % ks.length]);
    else if (e.key === 'ArrowDown') show(Math.min(n - 1, hi + 1)); else if (e.key === 'ArrowUp') show(Math.max(-2, hi - 1)); else return; e.preventDefault();
  });
  addEventListener('resize', function () { if (cur) show(hi); });
  grid(); if (keys.length) open(new URLSearchParams(location.search).get('k') || keys[0]);
})();
</script>
</body></html>
