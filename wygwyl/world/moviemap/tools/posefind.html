// the checks: does the found frame pick its own view among all 100? and what do random poses score?
PF.check = async (n, pose) => { const buf = eng.semBatch([pose], RW, RH), scores = [];
  for (let m = 1; m <= NV; m++) { if (!INFO[m].placeable) { scores.push(-2); continue; } const p = scoreFull(buf, 0, m, pose); scores.push(p.s < 0 ? -1 : blend(p, (await likeness(m, buf, 1))[0], m)); }
  const own = scores[n - 1]; return {own, rank: scores.filter(s => s > own).length + 1}; };
PF.nullScores = async (n, k = 60) => { const C = PF._C || (PF._C = candidates()), poses = []; for (let i = 0; i < k; i++) { const c = C[Math.floor(rnd() * C.length)]; poses.push({x: c.x, y: c.y, z: eng.groundY(c.x, c.y) + c.h, yaw: rnd() * 6.283, pitch: (rnd() - 0.5) * 0.9, hfov: 55 + rnd() * 30}); }
  const buf = eng.semBatch(poses, RW, RH), dn = await likeness(n, buf, poses.length), s = poses.map((p, k2) => { const q = scoreFull(buf, k2 * RW * RH * 2, n, p); return q.s < 0 ? -1 : blend(q, dn[k2], n); }).filter(x => x >= 0).sort((a, b) => a - b);
  return {median: s[s.length >> 1], p95: s[Math.floor(s.length * 0.95)]}; };
// what the found pose looks like: the city as photographed, and in the shared language
const COL = [[30, 40, 70], [200, 120, 80], [150, 60, 50], [120, 120, 120], [40, 110, 200], [60, 160, 70], [230, 200, 60], [120, 90, 70], [240, 80, 200], [80, 230, 230]];
PF.shoot = (pose, hour = 13) => { eng.setHour(hour); eng.setHfov(pose.hfov); eng.poseFree(pose.x, pose.y, pose.z, pose.yaw, pose.pitch); eng.advance(0); eng.render();
  const photo = eng.renderer.domElement.toDataURL('image/jpeg', 0.85), buf = eng.semBatch([pose], RW, RH), cv = document.createElement('canvas'); cv.width = RW; cv.height = RH;
  const g = cv.getContext('2d'), im = g.createImageData(RW, RH); for (let i = 0; i < RW * RH; i++) im.data.set([...COL[Math.min(9, buf[i * 2])], 255], i * 4); g.putImageData(im, 0, 0);
  return {photo, sem: cv.toDataURL('image/png')}; };
document.getElementById('s').textContent = 'ready'; window.pfReady = true;
