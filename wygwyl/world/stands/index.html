<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stands in the City</title>
<meta name="description" content="WYGWYL · each Midjourney view as a multiplane stand (wygwyl-world-arch: Depth Pro, SAM 2.1, its sheets at their measured depths) standing in the continuous city at the camera the pose finder found for it: exact from its own camera, and the city carrying on around it.">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#0b0c0f;--panel:rgba(14,15,19,.9);--line:rgba(255,255,255,.12);--ink:#ece6da;--dim:#9a948a;--acc:#ffb35c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 ui-monospace,Menlo,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;left:12px;top:12px;bottom:12px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(6px)}
#ui header{padding:12px 14px 8px;border-bottom:1px solid var(--line)}#ui h1{font:600 17px Georgia,serif;margin:2px 0 4px}#ui .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#list{overflow:auto;flex:1;padding:6px}.it{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:6px;border-radius:7px;cursor:pointer;border:1px solid transparent}.it:hover{background:rgba(255,255,255,.05)}.it.on{border-color:var(--acc)}
.it img{width:86px;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block}.it b{color:var(--ink)}.it div{color:var(--dim);font-size:11.5px}
#modes{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}#modes button{flex:1;min-width:80px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 6px;font:inherit;cursor:pointer}#modes button.on{border-color:var(--acc);color:var(--acc)}
#mix{padding:4px 12px 10px;color:var(--dim);font-size:11.5px}#mix input{width:100%}
#cap{position:fixed;left:324px;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--dim);font-size:12px;max-height:30vh;overflow:auto}#cap b{color:var(--ink)}
#s{position:fixed;right:14px;top:12px;color:var(--dim)}
@media (max-width:760px){#ui{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:46vh}#cap{left:8px;right:8px;top:8px;bottom:auto}}
</style>
</head>
<body><canvas id="c"></canvas>
<div id="ui"><header><div class="k">WYGWYL · world · stands in the city</div><h1>Each picture stands where the city puts its camera.</h1>
<div style="color:var(--dim);font-size:11.5px">Sheets cut and measured by <a style="color:#5fe8ff" href="https://github.com/hartswf0/wygwyl-world-arch">wygwyl-world-arch</a>; camera found in the city by the pose finder under that measured lens, pitch and height.</div></header>
<div id="list"></div>
<div id="mix">picture ↔ city <input id="op" type="range" min="0" max="1" step="0.01" value="1"></div>
<div id="modes"><button data-m="shot" class="on">at the shot</button><button data-m="aside">step aside</button><button data-m="over">from above</button></div></div>
<div id="cap">loading the city…</div><div id="s"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {makeEngine} from '../moviemap/engine.mjs';
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const HOUR = {haze: 19.6, hive: 1, overseer: 1, bay: 13, ascent: 23, plaza: 0.5, naraka: 1.5, ankhu: 2.5, commons: 20, arcade: 3.5, cenotaph: 7, temple: 7.5};
const [plan, SJ] = await Promise.all([fetch('../moviemap/plan.json').then(r => r.json()), fetch('stands.json').then(r => r.json())]);
const ST = SJ.stands.filter(s => s.pose), canvas = $('c');
const eng = await makeEngine({canvas, width: innerWidth, height: innerHeight, plan, base: '../city3d/', shadows: false, pixelRatio: Math.min(2, devicePixelRatio), onStep: (p, m) => $('s').textContent = `${p}% ${m}`});
eng.setEra(5); $('s').textContent = '';
const {scene, camera, renderer} = eng, tl = new THREE.TextureLoader();
addEventListener('resize', () => eng.resize(innerWidth, innerHeight));
// a stand: its sheets, far to near, each filling the frame at its measured depth, all hung from the found camera
function makeStand(s) {
  const g = new THREE.Group(), p = s.pose, fov = s.fov * Math.PI / 180, asp = s.aspect;
  eng.setHfov(s.fov); eng.poseFree(p.x, p.y, p.z, p.yaw, s.pitch * Math.PI / 180); camera.rotateZ(-(s.roll || 0) * Math.PI / 180); camera.updateMatrixWorld();
  g.position.copy(camera.position); g.quaternion.copy(camera.quaternion);
  const sheets = [...s.sheets].sort((a, b) => b.zm - a.zm), far = Math.min(2400, sheets[0].zm * 1.02);
  const add = (src, z, k) => { const w = 2 * z * Math.tan(fov / 2), h = w / asp, t = tl.load(src); t.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map: t, transparent: true, depthWrite: false, fog: false, toneMapped: false, side: THREE.DoubleSide}));
    m.position.z = -z; m.renderOrder = 10 + k; g.add(m); return m; };
  add(s.backdrop, far, 0).userData.backdrop = true;
  sheets.forEach((sh, k) => add(sh.src, Math.min(2300, sh.zm), k + 1));
  g.userData = {s, cam: {pos: camera.position.clone(), q: camera.quaternion.clone()}}; scene.add(g); return g;
}
const G = ST.map(makeStand);
// the picture's own air: the backdrop's mean colour, lifted, becomes the city's fog and sky, so the stand and the city share one atmosphere
const AIR = {}; await Promise.all(ST.map(s => new Promise(ok => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = 16; c.height = 9;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0, 16, 9); const d = g.getImageData(0, 0, 16, 9).data; let r = 0, gg = 0, b = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
  const n = d.length / 4; AIR[s.n] = new THREE.Color(r / n / 255, gg / n / 255, b / n / 255); ok(); }; im.onerror = ok; im.src = s.backdrop; })));
const DENS = {haze: 0.012, hive: 0.004, overseer: 0.004, bay: 0.005, naraka: 0.008, ankhu: 0.003, cenotaph: 0.007, temple: 0.006, arcade: 0.006, commons: 0.004, plaza: 0.003, ascent: 0.002};
// ui
let cur = 0, mode = 'shot', AIRNOW = null;
// the engine owns the fog (it re-weathers it every step) and draws a sky dome: the dome goes, and the picture's air is laid on after each step
const DOME = []; scene.traverse(o => { const m = o.material; if (m?.isShaderMaterial && !m.fog && (m.side === THREE.BackSide || o.isPoints)) DOME.push(o); });   // sky, stars
const air = () => { if (!AIRNOW) return; DOME.forEach(o => o.visible = false); if (scene.fog) { scene.fog.color.copy(AIRNOW.c); if ('density' in scene.fog) scene.fog.density = AIRNOW.d; } scene.background = AIRNOW.c; }; const ctl = new OrbitControls(camera, canvas); ctl.enableDamping = false; ctl.enabled = false;
$('list').innerHTML = ST.map((s, i) => `<div class="it" data-i="${i}"><img src="${s.backdrop}" alt="view ${s.n}"><div><b>${s.n}</b> · ${esc(s.class || '')}<br>lens ${s.fov.toFixed(0)}° · ${(+s.height).toFixed(1)} m above its ground<br>found ${s.pose.h.toFixed(1)} m up · #${s.pose.rank} of 100</div></div>`).join('');
const opacity = v => G.forEach(g => g.children.forEach(m => { m.material.opacity = m.userData.backdrop ? v * v : v; m.visible = v > 0.01; }));
$('op').oninput = e => opacity(+e.target.value);
function go(i, m = mode) {
  cur = i; mode = m; const g = G[i], s = g.userData.s; document.querySelectorAll('.it').forEach(e => e.classList.toggle('on', +e.dataset.i === i));
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  eng.setHour(HOUR[s.district] ?? 13);
  // at the shot the picture fills the screen: keep its vertical field when the window is narrower than the picture
  const va = 2 * Math.atan(Math.tan(s.fov * Math.PI / 360) / s.aspect), wa = innerWidth / innerHeight;
  eng.setHfov(m === 'shot' ? (wa < s.aspect ? 2 * Math.atan(Math.tan(va / 2) * wa) * 180 / Math.PI : s.fov) : 60);
  const air = AIR[s.n]; if (air) { const f = air.clone().lerp(new THREE.Color(1, 1, 1), 0.08); AIRNOW = {c: f, d: m === 'over' ? (DENS[s.district] ?? 0.004) * 0.15 : DENS[s.district] ?? 0.004}; }
  const hero = new THREE.Vector3(0, 0, -Math.min(60, s.z_hero || 10)).applyQuaternion(g.userData.cam.q).add(g.userData.cam.pos);
  if (m === 'shot') { ctl.enabled = false; camera.position.copy(g.userData.cam.pos); camera.quaternion.copy(g.userData.cam.q); }
  else if (m === 'aside') { const side = new THREE.Vector3(1, 0.25, 0.6).applyQuaternion(g.userData.cam.q).multiplyScalar(Math.max(8, (s.z_hero || 10) * 0.9));
    camera.position.copy(g.userData.cam.pos).add(side); ctl.target.copy(hero); ctl.enabled = true; ctl.update(); }
  else { camera.position.set(hero.x, hero.y + 420, hero.z + 260); ctl.target.copy(hero); ctl.enabled = true; ctl.update(); }
  const p = s.pose;
  $('cap').innerHTML = `<b>view ${s.n}</b> · ${esc(s.title)}<br>measured (Depth Pro, ground plane): lens <b>${s.fov.toFixed(1)}°</b>, pitch ${s.pitch.toFixed(1)}°, ${(+s.height).toFixed(2)} m above its ground · ${s.sheets.length} sheets from ${s.sheets.map(x => x.zm).sort((a, b) => a - b)[0].toFixed(1)} to ${Math.max(...s.sheets.map(x => x.zm)).toFixed(0)} m<br>found in the city: (${p.x.toFixed(0)}, ${p.y.toFixed(0)}), ${p.h.toFixed(1)} m up, heading ${(p.yaw * 180 / Math.PI).toFixed(0)}°, lens ${p.hfov.toFixed(0)}° · picks its own view #${p.rank} of 100 · the eye: the picture is <b>“${esc(p.ref)}”</b>, the city there is <b>“${esc(p.found)}”</b> (CLIP ${p.clip})`;
}
document.querySelectorAll('.it').forEach(e => e.onclick = () => go(+e.dataset.i));
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => go(cur, b.dataset.m));
let last = performance.now();
renderer.setAnimationLoop(t => { const dt = Math.min(0.05, (t - last) / 1000); last = t; if (ctl.enabled) ctl.update(); eng.advance(dt); air(); renderer.render(scene, camera); });
if (ST.length) go(0); else $('cap').textContent = 'no stands have a found camera yet';
window.STANDS = {G, go, eng};
</script>
</body></html>
