title: Poem 12 as Nine Shots
seed: Four older Black men carrying glowing hourglasses traverse nine string-lit interior and coastal spaces while a male voice recites a poem.
source_profile:
  source_type: poetic_short_film
  runtime_mode: discrete_nine_shot_montage
  patch_target_duration: 6-8s
diegesis:
  premise: Four older Black men appear across nine distinct locations united by overhead string lights and handheld hourglasses.
  world_rules:
    - Overhead warm bulb string lights appear in every interior and exterior space.
    - Handheld glass hourglasses contain red or yellow sand that frequently emits internal light.
    - Jersey details on the capped man shift across cuts while core outfits remain constant.
  core_entities:
    - Black_Man_Black_Shirt: older Black man, graying short hair and beard, black long-sleeve mock-neck shirt, black pants.
    - Black_Man_Rust_Jacket: older Black man, bald, beard, rust-brown overshirt over white t-shirt, brown pants.
    - Black_Man_Blue_Shirt: older Black man, gray-streaked locs and beard, light-blue button-up shirt, dark jeans or tan pants.
    - Black_Man_Cap_Jersey: older Black man, beard, flat cap, green sports jersey (varying white numbers or stripes), khaki or dark pants.
  core_locations:
    - Wooden hall with Welcome Home banner
    - Waterside stone pavilion
    - Dim auditorium with empty wooden seats
    - Forest with kintsugi-veined white border
    - Coastal meadow near white spired building
    - Beach dune path
    - Night hilltop path overlooking lit harbor
    - Sunset harbor lawn with pier
    - Grassy path leading to white house
  temporal_regime: Non-linear spatial montage spanning interiors, daylight, sunset, twilight, and night.
  sensory_regime:
    - Warm practical bulb lighting against varied ambient skies
    - Single male voiceover track; world sound not observed
