// files travel as base64 text in parts (artifacts serve only web types); join and decode here
async function raw(url) { try { const r = await fetch(url); if (!r.ok || /text\/html/.test(r.headers.get('content-type') || '')) return null; const b = await readWithProgress(r, 'Loading the world'); return b.length > 1024 ? b : null; } catch { return null; } }
async function fileOf(p, kind) { return (p.raw && p.raw[kind] && await raw(p.raw[kind])) || bytes(p[kind]); }   // the original file where it is served (GitHub Pages), else the text copy
const boot = (msg, frac) => { const s = document.getElementById('boot-s'); if (s && msg) s.textContent = msg; if (frac !== undefined) document.getElementById('boot-bar').style.width = Math.max(4, Math.min(100, frac * 100)) + '%'; };
async function readWithProgress(r, label) {   // stream a response, reporting how much has arrived

}

// LiDAR: the fused Atlas depth as points, coloured by height (blue ground to red top), brightness from the image
const LIDAR_VS = `attribute float lum; uniform float g, top, px; varying vec3 vC;

  return h<1.?mix(s0,s1,h):h<2.?mix(s1,s2,h-1.):h<3.?mix(s2,s3,h-2.):h<4.?mix(s3,s4,h-3.):mix(s4,s5,h-4.); }

}
async function loadSplat(p) { p.splatObj = new SplatMesh({ fileBytes: await fileOf(p, 'splat'), fileType: 'spz' }); await p.splatObj.initialized; p.splatObj.visible = false; scene.add(p.splatObj); }
async function loadMesh(p) { const g = await new GLTFLoader().parseAsync((await fileOf(p, 'mesh')).slice().buffer, ''); p.meshObj = g.scene; p.meshObj.visible = false; scene.add(p.meshObj); }

let reel = null, cur = null, mode = 'lidar', playing = false, tPaused = 0, look = null, lineShown = -1, W = [], last = performance.now();
const now = () => playing ? voice.currentTime : tPaused;
const placeAt = t => reel.places.find(p => t < p.t1) || reel.places[reel.places.length - 1];
const pending = new Map();   // place+mode -> promise, so each file loads once
function need(p, m) {
  const key = p.name + m; if (p[m + 'Obj'] || !p[m]) return Promise.resolve();
  if (!pending.has(key)) pending.set(key, ({ lidar: loadLidar, splat: loadSplat, mesh: loadMesh })[m](p).catch(e => { console.warn(m, p.name, e); p[m] = null; }));
  return pending.get(key);
}
function show() {   // the one object that is true now: this place, seen this way
  for (const r of Object.values(R)) for (const p of r.places) { for (const m of ['lidar', 'splat', 'mesh']) if (p[m + 'Obj']) p[m + 'Obj'].visible = p === cur && m === mode; if (p.bodyObj) p.bodyObj.o.visible = p === cur && bstyle === 'skeleton'; if (p.solid) p.solid.o.visible = p === cur && (bstyle === 'mannequin' || bstyle === 'blocks'); }
  const has = cur[mode + 'Obj'];
  $('note').textContent = has ? '' : cur[mode] ? `Loading ${cur.title.toLowerCase()} as ${mode === 'splat' ? 'splats' : mode}…` : `No ${mode} for this place`;
  document.querySelectorAll('.see button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.mode === mode); b.disabled = !cur[b.dataset.mode] && !cur[b.dataset.mode + 'Obj']; });
}
function enter(p, t) {
  if (cur === p) return; cur = p; $('place').textContent = p.title; need(p, mode).then(show); show();
  if (drive && t !== undefined) { const c = poseAt(p, t), E = new THREE.Euler().setFromQuaternion(c.q, 'YXZ'); look = { yaw: E.y, pitch: E.x, pos: c.pos }; } else if (!drive) look = null;
}
document.querySelectorAll('.see button').forEach(b => b.onclick = () => { mode = b.dataset.mode; need(cur, mode).then(show); show(); });

function poseAt(p, t) {   // the take's camera at time t, without moving the view
  const k = p.keys; let i = 0; while (i < k.length - 2 && t > k[i + 1].t) i++;
  const j = Math.min(i + 1, k.length - 1), a = k.length < 2 ? 0 : THREE.MathUtils.clamp((t - k[i].t) / Math.max(1e-3, k[j].t - k[i].t), 0, 1), e = a * a * (3 - 2 * a);
  return { pos: new THREE.Vector3(...k[i].p).lerp(new THREE.Vector3(...k[j].p), e), q: new THREE.Quaternion(...k[i].q).slerp(new THREE.Quaternion(...k[j].q), e) };
}
const ghost = (() => { const g = new THREE.BufferGeometry(), s = .6, w = s * 16 / 9 / 2, h = s / 2, z = -s * 1.1;
  const P = [[0,0,0],[-w,-h,z],[0,0,0],[w,-h,z],[0,0,0],[w,h,z],[0,0,0],[-w,h,z],[-w,-h,z],[w,-h,z],[w,-h,z],[w,h,z],[w,h,z],[-w,h,z],[-w,h,z],[-w,-h,z],[-w*.4,h,z],[0,h*1.6,z],[0,h*1.6,z],[w*.4,h,z]];
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(P.flat()), 3));
  const m = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x6f8cff, depthTest: false, transparent: true, opacity: .95 })); m.renderOrder = 11; m.visible = false; scene.add(m); return m; })();
function camAt(p, t) {
  const k = p.keys; let i = 0; while (i < k.length - 2 && t > k[i + 1].t) i++;
  const j = Math.min(i + 1, k.length - 1), a = k.length < 2 ? 0 : THREE.MathUtils.clamp((t - k[i].t) / Math.max(1e-3, k[j].t - k[i].t), 0, 1), e = a * a * (3 - 2 * a);
  camera.position.set(...k[i].p).lerp(new THREE.Vector3(...k[j].p), e);
  camera.quaternion.set(...k[i].q).slerp(new THREE.Quaternion(...k[j].q), e);
  const fov = 2 * Math.atan(p.h / 2 / p.fy) * 180 / Math.PI; if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
}
function words(t) {
  const box = $('words'), n = W.findIndex(l => t >= l.t0 - .05 && t <= l.t1 + 1.3);
  if (n !== lineShown) { lineShown = n; box.innerHTML = n < 0 ? '' : W[n].w.map(([w]) => `<span>${w.replace(/</g, '&lt;')}</span>`).join(' '); }
  if (n >= 0) W[n].w.forEach(([, wt], k) => box.children[k].classList.toggle('on', t >= wt - .02));
}
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function setPlay(p) {
  playing = p; $('play').classList.toggle('go', !p);
  if (p) { if (tPaused >= reel.end - .1) tPaused = 0; voice.currentTime = tPaused; voice.play().then(() => {}, () => { playing = false; label(); }); }
  else { tPaused = voice.currentTime || tPaused; voice.pause(); }
  label();
}
const label = () => $('play').textContent = playing ? 'Pause' : (tPaused > 0 && tPaused < reel.end - .1 ? 'Play' : 'Play with sound');
$('play').onclick = () => setPlay(!playing);
voice.addEventListener('ended', () => { setPlay(false); tPaused = reel.end; label(); });
function seekTo(x) { const r = $('seek').getBoundingClientRect(); tPaused = THREE.MathUtils.clamp((x - r.left) / r.width, 0, 1) * reel.end; if (playing) voice.currentTime = tPaused; label(); }
let seeking = false;
$('seek').addEventListener('pointerdown', e => { seeking = true; $('seek').setPointerCapture(e.pointerId); seekTo(e.clientX); });
$('seek').addEventListener('pointermove', e => { if (seeking) seekTo(e.clientX); });
$('seek').addEventListener('pointerup', () => seeking = false);
$('seek').addEventListener('keydown', e => { const d = e.key === 'ArrowRight' ? 3 : e.key === 'ArrowLeft' ? -3 : 0; if (d) { tPaused = THREE.MathUtils.clamp(now() + d, 0, reel.end); if (playing) voice.currentTime = tPaused; } });

async function openReel(id) {
  const r = R[id] || R.ride || Object.values(R)[0]; if (reel === r) return;
  if (playing) setPlay(false); setDrive(false); reel = r; tPaused = 0; cur = null; lineShown = -1;
  for (const [id, x] of Object.entries(R)) { const el = $('r-' + id); if (el) el.setAttribute('aria-current', x === r ? 'page' : 'false'); }
  if (r.bodiesFile && !r.bodiesLoaded) { try { const B = await fetch(r.bodiesFile).then(x => x.json()); for (const p of r.places) if (B[p.name]) p.bodies = B[p.name]; } catch (e) { console.warn('bodies', e); } r.bodiesLoaded = true; }

  $('about').textContent = r.about; voice.src = r.audio; W = r.words ? await fetch(r.words).then(x => x.json()) : []; $('words').innerHTML = '';
  $('seek').querySelectorAll('i').forEach(i => i.remove()); $('seek').setAttribute('aria-valuemax', r.end.toFixed(0));

  for (const p of r.places) need(p, 'lidar').then(show);   // every place's LiDAR first: it is light
  for (const p of r.places) await need(p, 'splat'); show();

addEventListener('hashchange', () => openReel(location.hash.slice(1)));

// drive: the take keeps playing (voice, words, bodies) while you move through the place; Follow returns to the take's camera
let drag = null, pinch = 0, drive = false; const ptrs = new Map(), keys = {}, stick = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 };
const grab = () => { if (!look) { const E = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); look = { yaw: E.y, pitch: E.x, pos: camera.position.clone() }; } setDrive(true); };
function setDrive(d) { drive = d; if (!d) look = null; $('drive').setAttribute('aria-pressed', d); $('drive').textContent = d ? 'Follow' : 'Drive'; $('hint').hidden = !d || matchMedia('(pointer: coarse)').matches; ghost.visible = d; }
$('drive').onclick = () => { if (drive) setDrive(false); else grab(); };
const STY = ['skeleton', 'mannequin', 'blocks', 'figure'];
$('bstyle').onclick = () => { bstyle = STY[(STY.indexOf(bstyle) + 1) % STY.length]; if (bstyle === 'figure') loadAnny(); $('bstyle').textContent = bstyle[0].toUpperCase() + bstyle.slice(1); show(); };
addEventListener('keydown', e => { if (e.target instanceof HTMLInputElement) return; const k = e.key.toLowerCase(); if ('wasdqe'.includes(k) || k.startsWith('arrow')) { keys[k] = 1; if (!drive) grab(); } if (k === 'shift') keys.shift = 1; });
addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys[k] = 0; if (k === 'shift') keys.shift = 0; });
const scale = () => { const m = cur && cur.lidarMeta; return m ? Math.max(1, Math.hypot(m.hi[0] - m.lo[0], m.hi[2] - m.lo[2])) : 20; };
function steer(dt) {   // keys and the touch stick move along the view; up and down with Q / E
  if (!drive || !look) return; const f = new THREE.Vector3(0, 0, -1).applyAxisAngle(UP, look.yaw), r = new THREE.Vector3(1, 0, 0).applyAxisAngle(UP, look.yaw);
  let fw = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0) - stick.dy, st = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0) + stick.dx, ud = (keys.e ? 1 : 0) - (keys.q ? 1 : 0);
  const v = scale() * .045 * (keys.shift ? 3 : 1) * dt;   // about a body length a second in most places; Shift for three look.pos.addScaledVector(f, fw * v).addScaledVector(r, st * v).addScaledVector(UP, ud * v);
}
const move = d => { if (look) look.pos.addScaledVector(new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion), d * scale() / 40); };
$('c').addEventListener('pointerdown', e => {
  grab();
  if (e.pointerType === 'touch' && e.clientX < innerWidth * .42 && stick.id === null) {   // left thumb: a stick where it lands
    Object.assign(stick, { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 }); const el = $('stick'); el.hidden = false; el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px'; return;
  }
  ptrs.set(e.pointerId, e); drag = [e.clientX, e.clientY];
});
addEventListener('pointerup', e => { if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; $('stick').hidden = true; } ptrs.delete(e.pointerId); drag = null; pinch = 0; });
addEventListener('pointercancel', e => { if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; $('stick').hidden = true; } ptrs.delete(e.pointerId); });
addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) { const dx = e.clientX - stick.x0, dy = e.clientY - stick.y0, r = Math.min(1, Math.hypot(dx, dy) / 50), a = Math.atan2(dy, dx);
    stick.dx = Math.cos(a) * r; stick.dy = Math.sin(a) * r; $('stick').firstChild.style.transform = `translate(${stick.dx * 33}px,${stick.dy * 33}px)`; return; }

  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) move((d - pinch) * .02); pinch = d; return; }
  if (!drag) return; look.yaw -= (e.clientX - drag[0]) * .005; look.pitch = THREE.MathUtils.clamp(look.pitch - (e.clientY - drag[1]) * .005, -1.2, 1.2); drag = [e.clientX, e.clientY];
});
addEventListener('wheel', e => { grab(); move(-e.deltaY * .004); }, { passive: true });
addEventListener('keydown', e => { if (e.key === ' ' && !(document.activeElement instanceof HTMLButtonElement)) { e.preventDefault(); setPlay(!playing); } });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  for (const r of Object.values(R)) for (const p of r.places) if (p.lidarObj) p.lidarObj.material.uniforms.px.value = innerHeight; });
window.__at = t => { tPaused = t; if (!drive) look = null; };   // for checks
window.__drive = (dx, dz, yaw) => { grab(); look.yaw += yaw || 0; look.pos.addScaledVector(new THREE.Vector3(1, 0, 0).applyAxisAngle(UP, look.yaw), dx * scale() / 10).addScaledVector(new THREE.Vector3(0, 0, -1).applyAxisAngle(UP, look.yaw), dz * scale() / 10); };
window.__style = s => { bstyle = s; if (s === 'figure') loadAnny(); $('bstyle').textContent = s[0].toUpperCase() + s.slice(1); show(); };
window.__dbg = () => ({ cam: camera.position.toArray().map(v => +v.toFixed(2)), scale: +scale().toFixed(1), drive, style: bstyle, solids: cur && cur.solid ? [cur.solid.limbs.count, cur.solid.torsos.count] : null, lidar: !!(cur && cur.lidarObj && cur.lidarObj.visible) });
window.__mode = m => { mode = m; need(cur, m).then(show); show(); };

renderer.setAnimationLoop(() => {
  if (!reel) return;
  const t = now(), p = placeAt(t), dt = Math.min(.1, (performance.now() - last) / 1000); last = performance.now(); enter(p, t); steer(dt);
  if (drive) { const c = poseAt(p, t); ghost.position.copy(c.pos); ghost.quaternion.copy(c.q); ghost.scale.setScalar(scale() / 30); }
  if (look) { camera.quaternion.setFromEuler(new THREE.Euler(look.pitch, look.yaw, 0, 'YXZ')); camera.position.copy(look.pos); } else camAt(p, t);
  const cut = (p.t0 > 0 && t - p.t0 < .45) || (p.t1 < reel.end && p.t1 - t < .45); $('veil').style.opacity = cut && !drive ? 1 : 0;   // the world drains to blue at each cut
  if (cur && cur.bodies) poseBodies(cur, t);
  words(t); $('fill').style.width = (t / reel.end * 100) + '%'; $('time').textContent = `${fmt(t)} / ${fmt(reel.end)}`; $('seek').setAttribute('aria-valuenow', t.toFixed(1));
  renderer.render(scene, camera);
});
try { await openReel(location.hash.slice(1) || (R.ride ? 'ride' : Object.keys(R)[0])); window.__ready = true; }
catch (e) { window.__bootFail ? window.__bootFail('A file could not be loaded (' + (e.message || e) + '). Reload the page to try again.') : fault('A file could not be loaded. Reload the page to try again.'); console.error(e); }
</script>
