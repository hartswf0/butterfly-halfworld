<title>Magic Ride</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@1&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* One stage. The world fills it. Top: which reel, which place. Low: his words. Bottom: time, and the three ways to see. */
:root{
  --stage:#030409; --ink:#f2f3fb; --dim:#8a92b0; --water:#1f4dff; --line:rgba(242,243,251,.2);
  --word:"IM Fell English",Georgia,"Times New Roman",serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:13px/1.4 var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
#veil{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 60%,var(--water),var(--stage) 72%);opacity:0;pointer-events:none;transition:opacity .45s ease}
.top{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:6px;background:linear-gradient(rgba(3,4,9,.7),transparent);pointer-events:none}
.reels{display:flex;gap:18px;pointer-events:auto;overflow-x:auto;white-space:nowrap;scrollbar-width:none;max-width:100%}.reels::-webkit-scrollbar{display:none}
.reels a{color:var(--dim);text-decoration:none;font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:6px 0;border-bottom:2px solid transparent}
.reels a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--water)}
.reels a:focus-visible{outline:2px solid var(--water);outline-offset:3px}
#about{color:var(--dim);font-size:11px;line-height:1.45;max-width:60ch}
#place{color:var(--ink);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
#words{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  text-align:center;font:italic 400 clamp(19px,3.1vw,32px)/1.32 var(--word);text-wrap:balance;text-shadow:0 1px 14px rgba(0,0,0,.9),0 0 2px #000;pointer-events:none}
#words span{opacity:0;transition:opacity .22s ease}#words span.on{opacity:1}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:8px;background:linear-gradient(transparent,rgba(3,4,9,.78) 38%)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
button{all:unset;cursor:pointer;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);padding:10px 13px}
button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
button.go{background:var(--water);border-color:var(--water)}
#time{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.06em;margin-right:auto}
.see{display:flex}.see button{border-right-width:0}.see button:last-child{border-right-width:1px}
.see button[aria-pressed="true"]{background:var(--ink);color:var(--stage)}
.see button:disabled{opacity:.35;cursor:default}
#seek{position:relative;height:22px;cursor:pointer;touch-action:none}
#seek::before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:var(--line)}
#fill{position:absolute;left:0;top:9px;height:3px;background:var(--water);width:0}
#seek i{position:absolute;top:6px;width:1px;height:10px;background:var(--dim)}
#note{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;min-height:1em}
#hint{position:fixed;left:0;right:0;top:calc(118px + env(safe-area-inset-top,0px));text-align:center;color:var(--ink);opacity:.7;font-size:11px;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:1px solid var(--line);border-radius:50%;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--water);opacity:.8}
#drive[aria-pressed="true"]{background:var(--ink);color:var(--stage)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--stage);z-index:50;padding:24px;transition:opacity .5s}
#boot.done{opacity:0;pointer-events:none}
#boot div{display:grid;gap:10px;width:min(320px,80vw);text-align:center}
#boot b{font:italic 400 24px/1.3 var(--word)}#boot span{color:var(--dim);font-size:11px;letter-spacing:.08em;line-height:1.5}
#boot i{display:block;height:2px;background:var(--line)}#boot u{display:block;height:2px;width:4%;background:var(--water);transition:width .3s}
#boot.bad u{background:#ff5a5a;width:100%}
#chip{position:fixed;left:0;top:0;display:flex;align-items:center;gap:6px;padding:5px 5px 5px 11px;background:rgba(3,4,9,.82);border:1px solid var(--line);white-space:nowrap;transform:translate(-50%,-130%);z-index:5}
#chip span{color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-right:2px}
#chip button{padding:8px 10px;font-size:10px}#chip button[aria-pressed="true"]{background:var(--ink);color:var(--stage)}
#paths[aria-pressed="true"]{background:var(--ink);color:var(--stage)}
#fault{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink);font:italic 22px/1.4 var(--word);background:var(--stage)}
@media (prefers-reduced-motion:reduce){#veil,#words span{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="The rebuilt world. Tap a body to choose it. Drag to look and W A S D to move while the take plays; on a phone the left thumb moves and the right looks. Follow returns to the take's camera."></canvas>
<div id="veil"></div>
<header class="top">
  <nav class="reels" id="reels" aria-label="Reels"></nav>
  <div id="about"></div>
  <div id="place"></div>
</header>
<div id="words" aria-live="polite"></div>
<div class="bar">
  <div id="note" aria-live="polite">Loading…</div>
  <div id="seek" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="53" aria-valuenow="0" tabindex="0"><div id="fill"></div></div>
  <div class="row">
    <button id="play" class="go" type="button">Play with sound</button>
    <span id="time">0:00 / 0:00</span>
    <button id="drive" type="button" aria-pressed="false" title="Move freely while the take plays">Drive</button>
    <button id="bstyle" type="button" title="What stands on the tracked skeletons">Skeleton</button>
    <button id="lookb" type="button" title="How the LiDAR feels: height, water, rain, shore, memory, pulse">Height</button>
    <button id="paths" type="button" aria-pressed="false" title="Lines of flight: the camera's path and every body's path through the place">Paths</button>
    <div class="see" role="group" aria-label="How to see the world">
      <button type="button" data-mode="lidar" aria-pressed="true">LiDAR</button><button type="button" data-mode="splat" aria-pressed="false">Splats</button><button type="button" data-mode="mesh" aria-pressed="false">Mesh</button>
    </div>
  </div>
</div>
<div id="hint" hidden>W A S D or arrows to move · drag to look · Q / E down / up · Shift faster</div>
<div id="stick" hidden><i></i></div>
<div id="chip" hidden><span id="chip-t">Person</span><button id="can" type="button" aria-pressed="false" title="Give this person a jerrycan, carried at the tracked wrists">Jerrycan</button><button id="become" type="button" aria-pressed="false" title="Ride behind this person">Become</button><button id="unsel" type="button" aria-label="Let go of this person">×</button></div>
<div id="fault" hidden></div>
<div id="boot" role="status" aria-live="polite"><div><b id="boot-t">Loading the world</b><span id="boot-s">Starting…</span><i><u id="boot-bar"></u></i></div></div>
<script>
// before any module runs: if the viewer cannot start, say so instead of a black screen
(function () {
  var s = document.getElementById('boot-s');
  window.__bootFail = function (m) { var b = document.getElementById('boot'); if (b) { b.classList.add('bad'); document.getElementById('boot-t').textContent = 'This viewer could not start'; s.textContent = m; } };
  if (!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) window.__bootFail('This browser is too old for it. Open it in a current Chrome, Firefox or Edge, or Safari 16.4 or newer.');
  addEventListener('error', function (e) { if (!window.__ready && e.message) window.__bootFail(e.message); });
  setTimeout(function () { if (!window.__ready && !document.getElementById('boot').classList.contains('bad')) s.textContent = 'Still loading. A slow connection takes a minute; the first place is about 15 MB.'; }, 20000);
})();
</script>

function hear() {   // the voice level, for Water and Pulse; same-origin audio only

  catch (e) { an = false; }
}
function voiceLevel() { if (!an || !playing) return level *= .9; an.getFloatTimeDomainData(abuf); let q = 0; for (const v of abuf) q += v * v; const rms = Math.sqrt(q / abuf.length); return level += (Math.min(1, rms * 5) - level) * .25; }
const store = () => 'wygwyl-view:' + (window.REEL_FILE || document.title) + ':' + (reel && reel.title);
function save() { try { localStorage.setItem(store(), JSON.stringify({ look: lookMode, paths, cans: [...cans] })); } catch (e) {} }
function recall() {
  let v = null; try { v = JSON.parse(localStorage.getItem(store()) || 'null'); } catch (e) {}
  setLook(v ? v.look | 0 : 0, true); setPaths(!!(v && v.paths), true); cans.clear(); if (v && v.cans) v.cans.forEach(k => cans.add(k)); choose(null);
}
function setLook(i, quiet) { lookMode = ((i % LOOKS.length) + LOOKS.length) % LOOKS.length; $('lookb').textContent = LOOKS[lookMode]; if (lookMode === 1 || lookMode === 5) hear(); if (!quiet) save(); }
function setPaths(on, quiet) { paths = on; $('paths').setAttribute('aria-pressed', on); if (cur) show(); if (!quiet) save(); }
$('lookb').onclick = () => setLook(lookMode + 1);
$('paths').onclick = () => setPaths(!paths);

// lines of flight: the take's camera through the place, and each tracked body's hips through time, dim to bright as time runs
function pathsFor(p) {
  const g = new THREE.Group(), mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .9, depthTest: false }), dot = new THREE.PointsMaterial({ vertexColors: true, size: 5, sizeAttenuation: false, transparent: true, opacity: .95, depthTest: false });
  const line = (pts, hue, sat) => { if (pts.length < 2) return; const P = new Float32Array(pts.length * 3), Cc = new Float32Array(pts.length * 3), c = new THREE.Color();
    pts.forEach((x, i) => { P.set(x, i * 3); c.setHSL(hue, sat, .22 + .58 * i / (pts.length - 1)); Cc.set([c.r, c.g, c.b], i * 3); });
    const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(P, 3)); gg.setAttribute('color', new THREE.BufferAttribute(Cc, 3)); const l = new THREE.Line(gg, mat), d = new THREE.Points(gg, dot); l.renderOrder = d.renderOrder = 9; l.frustumCulled = d.frustumCulled = false; g.add(l, d); };

  for (const [id, pts] of tr) line(pts, (id * .137) % 1, .75);
  g.visible = false; scene.add(g); return (p.pathObj = g);
}

// choosing a body: a tap near its hips or head
const _pv = new THREE.Vector3();
function onScreen(x) { _pv.set(...x).project(camera); return _pv.z < 1 ? [(_pv.x + 1) / 2 * innerWidth, (1 - _pv.y) / 2 * innerHeight] : null; }
function pick(x, y) {
  if (!cur) return; let best = null, bd = 72;
  for (const b of people(cur, now())) for (const j of [0, 9, 10, 5, 6]) if (b.ok(j)) { const s = onScreen(b.X(j)); if (s) { const d = Math.hypot(s[0] - x, s[1] - y); if (d < bd) { bd = d; best = b.id; } } }
  choose(best === null ? null : key(cur, best));
}
function choose(k) {
  sel = k; $('chip').hidden = k === null; if (k === null) { if (become) setBecome(false); return; }
  $('chip-t').textContent = 'Person ' + (+k.split(':').pop() + 1); $('can').setAttribute('aria-pressed', cans.has(k)); $('become').setAttribute('aria-pressed', become);
}
$('can').onclick = () => { if (!sel) return; cans.has(sel) ? cans.delete(sel) : cans.add(sel); $('can').setAttribute('aria-pressed', cans.has(sel)); save(); };
$('become').onclick = () => setBecome(!become);
$('unsel').onclick = () => choose(null);
function setBecome(on) { become = on && !!sel; if (become) { setDrive(false); } $('become').setAttribute('aria-pressed', become); }

// a body's frame: hips, up, forward (the way the figure faces), height
function frameOf(b) {
  const V = k => new THREE.Vector3(...b.X(k)); if (!(b.ok(5) && b.ok(6) && b.ok(9) && b.ok(10))) return null;
  const hip = V(9).add(V(10)).multiplyScalar(.5), sh = V(5).add(V(6)).multiplyScalar(.5), up = sh.clone().sub(hip).normalize();
  const fwd = new THREE.Vector3().crossVectors(V(9).sub(V(10)).normalize(), up).normalize();
  const tall = b.ok(0) && b.ok(13) ? V(0).distanceTo(V(13)) / .9 : sh.distanceTo(hip) / .3;
  return { hip, sh, up, fwd, tall, wide: V(5).distanceTo(V(6)) || .4 };
}

// the jerrycan: 20 litres, 47 x 35 x 16.5 cm, handle on top, carried at the wrists (both hands if they are close, else the lower hand)
const CAN = (() => { const m = new THREE.MeshStandardMaterial({ color: 0xd8a11c, roughness: .55, metalness: .05, emissive: 0x2a1c00 }), g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(.165, .35, .47), m); body.position.y = -.175 - .05;
  const grip = new THREE.Mesh(new THREE.BoxGeometry(.03, .03, .2), m); grip.position.y = -.015;
  const posts = [-.08, .08].map(z => { const q = new THREE.Mesh(new THREE.BoxGeometry(.03, .05, .03), m); q.position.set(0, -.04, z); return q; });
  const spout = new THREE.Mesh(new THREE.CylinderGeometry(.022, .022, .06, 10), m); spout.position.set(0, -.02, .2);
  g.add(body, grip, ...posts, spout); return g; })();
const canPool = [];
function poseCans(p, ps) {
  let n = 0;
  if (p === cur) for (const b of ps) {
    if (!cans.has(key(p, b.id))) continue; const f = frameOf(b); if (!f || !(b.ok(62) || b.ok(41))) continue;
    const L = b.ok(62) ? new THREE.Vector3(...b.X(62)) : null, Rw = b.ok(41) ? new THREE.Vector3(...b.X(41)) : null;
    const hand = L && Rw ? (L.distanceTo(Rw) < f.wide * .6 ? L.clone().add(Rw).multiplyScalar(.5) : (L.y < Rw.y ? L : Rw)) : (L || Rw);
    const c = canPool[n] || (canPool[n] = (() => { const o = CAN.clone(); o.traverse(x => x.frustumCulled = false); scene.add(o); return o; })()); n++;
    const fl = f.fwd.clone().sub(f.up.clone().multiplyScalar(f.fwd.dot(f.up))).normalize(), ac = new THREE.Vector3().crossVectors(f.up, fl);
    _m.makeBasis(ac, f.up, fl); c.quaternion.setFromRotationMatrix(_m); c.scale.setScalar(f.wide / .4); c.position.copy(hand); c.visible = true;
  }
  for (let i = n; i < canPool.length; i++) canPool[i].visible = false;
}
const _cam = new THREE.PerspectiveCamera();
function ride(b) {   // behind and a little above the chosen body, looking where it faces
  const f = frameOf(b); if (!f) return;
  _cam.position.copy(f.hip).addScaledVector(f.fwd, -f.tall * 2.4).addScaledVector(UP, f.tall * .75);
  _cam.lookAt(f.hip.clone().addScaledVector(f.fwd, f.tall * 3).addScaledVector(UP, f.tall * .15));
  camera.position.lerp(_cam.position, .12); camera.quaternion.slerp(_cam.quaternion, .12);
}
function chipAt(ps) {
  if (!sel) return; const b = cur && sel.startsWith(cur.name + ':') ? ps.find(q => key(cur, q.id) === sel) : null, el = $('chip');
  if (!b) { el.style.opacity = .55; return; } el.style.opacity = 1;
  const top = b.ok(0) ? b.X(0) : b.X(5), s = onScreen(top); if (!s) return;
  el.style.left = Math.max(90, Math.min(innerWidth - 90, s[0])) + 'px'; el.style.top = Math.max(150, Math.min(innerHeight - 200, s[1])) + 'px';
}
window.__look = i => setLook(i); window.__paths = b => setPaths(b); window.__pick = (x, y) => pick(x, y);
window.__choose = id => choose(id === null ? null : key(cur, id)); window.__can = () => $('can').click(); window.__become = on => setBecome(on);
window.__people = () => cur ? people(cur, now()).map(b => b.id) : [];

renderer.setAnimationLoop(() => {
  if (!reel) return;
  const t = now(), p = placeAt(t), dt = Math.min(.1, (performance.now() - last) / 1000); last = performance.now(); enter(p, t); steer(dt);
  if (drive) { const c = poseAt(p, t); ghost.position.copy(c.pos); ghost.quaternion.copy(c.q); ghost.scale.setScalar(scale() / 30); }
  const ps = cur && cur.bodies ? people(cur, t) : [], rb = become && sel ? ps.find(q => key(cur, q.id) === sel) : null;
  if (look) { camera.quaternion.setFromEuler(new THREE.Euler(look.pitch, look.yaw, 0, 'YXZ')); camera.position.copy(look.pos); } else if (become) { if (rb) ride(rb); } else camAt(p, t);

  if (cur && cur.bodies) poseBodies(cur, t);
  poseCans(cur, ps); chipAt(ps);

    u.uLevel.value = voiceLevel(); u.uBeat.value = Math.exp(-(performance.now() - beatAt) / 1000 * 6); } $('fill').style.width = (t / reel.end * 100) + '%'; $('time').textContent = `${fmt(t)} / ${fmt(reel.end)}`; $('seek').setAttribute('aria-valuenow', t.toFixed(1));
  renderer.render(scene, camera);
});
try { await openReel(location.hash.slice(1) || (R.ride ? 'ride' : Object.keys(R)[0])); window.__ready = true; }
catch (e) { window.__bootFail ? window.__bootFail('A file could not be loaded (' + (e.message || e) + '). Reload the page to try again.') : fault('A file could not be loaded. Reload the page to try again.'); console.error(e); }
