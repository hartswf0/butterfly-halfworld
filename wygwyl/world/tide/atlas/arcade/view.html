<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Splats</title>
<style>
:root{--bg:#02030c;--ink:#f4f6ff;--dim:#8b93b5;--blue:#1f4dff;--m:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--m);overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.hud{position:fixed;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.hud a{color:var(--ink);pointer-events:auto}.bar{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.55);color:var(--ink);border:1px solid rgba(255,255,255,.25);padding:8px 12px;cursor:pointer}
button.on{background:var(--blue);border-color:var(--blue)}#msg{color:var(--dim);font-size:11px;margin-left:auto}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/","@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"}}</script>
</head><body>
<div class="hud"><span>WYGWYL · Arcade, zone 091 · Atlas splats</span><span><a href="../../seg/index.html#street-091">cut-outs</a> · <a href="../../watch.html">watch</a></span></div>
<div class="bar"><button id="b-path" class="on">Genie path</button><button id="b-orbit">Free look</button><button id="b-q">Draft</button><span id="msg">loading splats…</span></div>
<script type="module">
import * as THREE from 'three';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';
const P = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x02030c);
const cams = await (await fetch('cameras.json')).json();
const fov = 2 * Math.atan(cams[0].h / 2 / cams[0].fy) * 180 / Math.PI;
const camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.05, 500);
scene.add(new SparkRenderer({ renderer }));
const files = { draft: 'arcade_draft.spz', refined: P.get('refined') || 'arcade_refined.spz' };
let quality = P.get('q') === 'refined' ? 'refined' : 'draft', splats = null;
async function load(q) {
  document.getElementById('msg').textContent = 'loading ' + q + '…';
  const s = new SplatMesh({ url: files[q] }); await s.initialized;
  if (splats) { scene.remove(splats); splats.dispose?.(); } splats = s; scene.add(s);
  document.getElementById('msg').textContent = q + ' · ' + (s.packedSplats?.numSplats ?? s.numSplats ?? '?').toLocaleString() + ' splats'; window.__ready = true;
}
// the Genie camera path: RUB camera-to-world poses = three.js's own camera convention
const PT = cams.map(c => new THREE.Vector3(...c.p)), QT = cams.map(c => new THREE.Quaternion(...c.q));
const curve = new THREE.CatmullRomCurve3(PT, false, 'centripetal');
function pose(u) {  // u in [0,1] along the path
  const f = u * (cams.length - 1), i = Math.min(cams.length - 2, Math.floor(f)), a = f - i;
  camera.position.copy(curve.getPoint(u)); camera.quaternion.slerpQuaternions(QT[i], QT[i + 1], a);
}
let mode = 'path', t0 = performance.now(), yaw = 0, pitch = 0, drag = null;
const dur = 19;
window.__setT = u => { mode = 'manual'; pose(u); renderer.render(scene, camera); };
document.getElementById('b-path').onclick = () => { mode = 'path'; t0 = performance.now(); tog(); };
document.getElementById('b-orbit').onclick = () => { mode = 'free'; const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); yaw = e.y; pitch = e.x; tog(); };
document.getElementById('b-q').onclick = async e => { quality = quality === 'draft' ? 'refined' : 'draft'; e.target.textContent = quality[0].toUpperCase() + quality.slice(1); try { await load(quality); } catch { document.getElementById('msg').textContent = 'refined splats not ready'; } };
function tog() { document.getElementById('b-path').classList.toggle('on', mode === 'path'); document.getElementById('b-orbit').classList.toggle('on', mode === 'free'); }
const keys = {}; addEventListener('keydown', e => keys[e.key.toLowerCase()] = 1); addEventListener('keyup', e => keys[e.key.toLowerCase()] = 0);
renderer.domElement.addEventListener('pointerdown', e => { if (mode !== 'free') document.getElementById('b-orbit').click(); drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * .004; pitch = Math.max(-1.3, Math.min(1.3, pitch - (e.clientY - drag[1]) * .004)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => { const d = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); camera.position.addScaledVector(d, -e.deltaY * .004); }, { passive: true });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
pose(0);
renderer.setAnimationLoop(() => {
  if (mode === 'path') pose(((performance.now() - t0) / 1000 / dur) % 1);
  else if (mode === 'free') {
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion), r = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(f, ((keys.w || keys.arrowup) - (keys.s || keys.arrowdown) || 0) * .05).addScaledVector(r, ((keys.d || keys.arrowright) - (keys.a || keys.arrowleft) || 0) * .05);
  }
  if (mode !== 'manual') renderer.render(scene, camera);
});
await load(quality);
</script></body></html>
